packages:
  - 'apps/*'
  - 'packages/*'

# Security overrides for transitive dependencies whose parents pin a vulnerable
# range. Each stays inside an API the parent already uses:
# - postcss: @expo/metro-config pins ~8.4.32; 8.5 is the same major.
# - uuid: exceljs pins ^8.3.0 and only calls `require('uuid').v4`, which uuid 11
#   still ships as CommonJS (12+ is ESM-only, so stop at 11).
overrides:
  '@expo/metro-config>postcss': ^8.5.18
  'exceljs>uuid': ^11.1.1

# react-native-youtube-iframe 2.4.1 posts play/pause/rate as JSON, which its hosted player page
# (iframe_v2.html) doesn't parse, so they were dropped. The patch adds playVideo, pauseVideo and
# setPlaybackRate to the ref, injected like seekTo (owner, 2026-11-15: "the video is stuck").
patchedDependencies:
  react-native-youtube-iframe@2.4.1: patches/react-native-youtube-iframe@2.4.1.patch
