name: Unit tests

# Runs on every pull request (owner, refactor Q24), and by hand from the Actions tab.
# `pnpm check`: lint (Prettier, ESLint with the size and boundary rules), typecheck, the
# unit tests of every package, the dead-export, 400-line and Claude-guide path checks. Needs no
# database. Integration tests stay the manual "Integration tests (on demand)" workflow.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        working-directory: apps/backend
      - run: pnpm check
