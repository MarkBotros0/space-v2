name: Mobile E2E (Maestro)

# Runs the Maestro flows in apps/mobile/.maestro against a release APK on an
# Android emulator, backed by a throwaway Postgres + the real backend. Free:
# uses only GitHub-hosted runners (Linux minutes) and open-source tooling.
# Nothing here touches the shared staging database or needs any secret.
on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "apps/backend/**"
      - "packages/shared/**"
      - ".github/workflows/mobile-e2e.yml"
  workflow_dispatch:

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      # 10.0.2.2 is the emulator's alias for the runner's localhost.
      EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:4000
      E2E_BUILD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: pnpm install --frozen-lockfile

      - name: Prepare database and start backend
        working-directory: apps/backend
        run: |
          pnpm db:generate
          pnpm db:migrate:local
          pnpm seed:e2e
          nohup pnpm dev > ../../backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://localhost:4000/health && exit 0
            sleep 2
          done
          cat ../../backend.log
          exit 1

      - name: Build Android release APK
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
          mkdir -p ../../../artifacts
          cp app/build/outputs/apk/release/app-release.apk ../../../artifacts/app.apk

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install artifacts/app.apk
            maestro test apps/mobile/.maestro --format junit --output maestro-report.xml --test-output-dir maestro-output

      - name: Upload Maestro results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-failure
          path: |
            maestro-report.xml
            maestro-output/
            backend.log
          if-no-files-found: ignore
          retention-days: 7
