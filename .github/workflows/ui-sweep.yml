name: UI sweep (Android emulator)

# Runs tools/ui-reference/ui-sweep.mjs on a GitHub-hosted Android emulator,
# for anyone without the devbox capture rig. Free: the repo is public, so
# Linux runner minutes cost nothing.
#
# Everything the app shows comes from a throwaway Postgres in this job,
# migrated with prisma/migrations and seeded with fake users
# (apps/backend/scripts/seed-sweep.ts). Never point this at the staging
# database: the repo is PUBLIC, so the uploaded contact sheet can be
# downloaded by anyone signed in to GitHub, and the seed refuses non-local
# hosts anyway.
#
# The login limiter allows 20 sign-ins per 15 minutes. One signed-in flow per
# cell stays under it; many signed-in flows in one run would not.
on:
  workflow_dispatch:
    inputs:
      cells:
        description: "Cell prefixes, comma-separated (blank = all 16)"
        required: false
        default: ""
      flows:
        description: "Flow prefixes, comma-separated (blank = all)"
        required: false
        default: ""
  pull_request:
    paths:
      - "apps/mobile/.maestro/**"
      - "tools/ui-reference/ui-sweep.mjs"
      - "tools/ui-reference/lib/sweep.mjs"
      - "apps/backend/scripts/seed-sweep.ts"
      - ".github/workflows/ui-sweep.yml"

concurrency:
  group: ui-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sweep
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sweep
      AUTH_SECRET: ci-only-sweep-secret-not-used-anywhere-else
      # 10.0.2.2 is the emulator's alias for the runner's localhost.
      EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:4100
      SWEEP_CELLS: ${{ github.event.inputs.cells || '' }}
      SWEEP_FLOWS: ${{ github.event.inputs.flows || '' }}
      UI_SWEEP_ADB: adb
      UI_SWEEP_DEVICE: emulator-5554
      UI_SWEEP_NO_METRO: "1"
      UI_SWEEP_OUTPUT: ${{ github.workspace }}/ui-sweep-output
      UI_SWEEP_USERS_FILE: ${{ github.workspace }}/sweep-users.json
      UI_SWEEP_PASSWORD: sweep-password-123 # the fake users' password, from seed-sweep.ts
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Throwaway database with fake users, and the backend on :4100
        working-directory: apps/backend
        run: |
          pnpm db:generate
          pnpm db:migrate:local
          pnpm seed:sweep "$UI_SWEEP_USERS_FILE"
          PORT=4100 nohup npx ts-node --transpile-only src/server.ts > "$GITHUB_WORKSPACE/backend.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://localhost:4100/health && exit 0
            sleep 2
          done
          cat "$GITHUB_WORKSPACE/backend.log"
          exit 1

      - name: Build Android release APK (JS bundle embedded, no Metro)
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --no-install
          # Release builds refuse plain http; this APK only talks to the
          # job's own backend over http://10.0.2.2:4100.
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/app.apk"

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the sweep
        uses: reactivecircus/android-emulator-runner@v2
        env:
          UI_SWEEP_MAESTRO: maestro
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          # One line: the action runs each script line in its own shell.
          script: adb install -r app.apk && node tools/ui-reference/ui-sweep.mjs ${SWEEP_FLOWS:+--flows="$SWEEP_FLOWS"} ${SWEEP_CELLS:+--cells="$SWEEP_CELLS"}

      - name: Upload contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-sweep
          path: |
            ui-sweep-output/
            backend.log
          if-no-files-found: ignore
          retention-days: 14
