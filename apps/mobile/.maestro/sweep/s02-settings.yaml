# UI sweep 02 — a student's account pages: Profile (read-only), Edit profile
# with the keyboard on its first and its lowest personal field, and
# Notification settings (the gear on Notifications). There is no Settings
# page any more (owner, 2026-11-06/07): Profile is /profile with Edit ->
# /edit-profile, theme and sign out live on More (s09), notification settings
# open from Notifications. The example for signed-in flows. Nothing is saved:
# a sweep flow types and looks, then leaves; Save changes is never tapped, and
# nothing is typed, so Edit profile has no change to lose or keep.
appId: com.jpc.space
---
- runFlow:
    file: _sign-in.yaml
    env:
      EMAIL: ${STUDENT_EMAIL}
- openLink: spacev2://profile
# The Edit pill sits in the identity card at the top (its label is "Edit profile").
- extendedWaitUntil:
    visible: 'Edit profile'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s02-01-profile

- tapOn: 'Edit profile'
# The pinned Save bar is Screen's footer, always on screen.
- extendedWaitUntil:
    visible: 'Save changes'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s02-02-edit-profile

# "Name" alone is the input's label: the visible label reads "Name *".
- runFlow:
    file: _tap.yaml
    env:
      TARGET: 'Name'
- waitForAnimationToEnd:
    timeout: 3000
# The field and the Save bar riding the keyboard must both show.
- takeScreenshot: s02-03-edit-name-kbd
- hideKeyboard

# Address is the lowest of the personal fields (a multi-line box).
- runFlow:
    file: _tap.yaml
    env:
      TARGET: 'Address'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s02-04-edit-address-kbd
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
# A band of padding left behind once the keyboard closes shows here.
- takeScreenshot: s02-05-edit-after-kbd

# Notification settings: from the gear on Notifications, as a person reaches them.
- openLink: spacev2://notifications
- extendedWaitUntil:
    visible: 'Notification settings'
    timeout: 40000
- tapOn: 'Notification settings'
# The push section heading (headers render upper-case).
- extendedWaitUntil:
    visible: 'PUSH NOTIFICATIONS'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
# On an emulator with no push token only "Enable push" shows; it is never tapped
# (it registers the device with the server).
- takeScreenshot: s02-06-notification-settings
# The last line has to clear the system bar.
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s02-07-notification-settings-bottom
