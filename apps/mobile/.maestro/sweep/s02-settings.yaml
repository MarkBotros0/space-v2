# UI sweep 02 — Settings as a student: the page top to bottom, and the
# keyboard on the profile name and on the lowest change-password field. The
# example for signed-in flows. Nothing is saved: the backend shares its
# database with v1, so a sweep flow types and looks, then leaves.
appId: com.jpc.space
---
- runFlow:
    file: _sign-in.yaml
    env:
      EMAIL: ${STUDENT_EMAIL}
- openLink: spacev2://settings
- extendedWaitUntil:
    visible: 'Profile, password, and notification preferences.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s02-01-settings

- runFlow:
    file: _tap.yaml
    env:
      TARGET: 'Name'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s02-02-settings-name-kbd
- hideKeyboard

- runFlow:
    file: _tap.yaml
    env:
      TARGET: 'Confirm new password'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s02-03-settings-password-kbd
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s02-04-settings-password

# The last section has to clear the floating tab bar and the system bar.
# Restart the app first (still signed in): hiding the keyboard leaves
# "Confirm new password" focused, the page then stayed pinned on it and the
# scroll below never moved (CI runs 13-19). Reopening the link alone keeps
# the same mounted screen, focus included.
- stopApp
- launchApp
- openLink: spacev2://settings
- extendedWaitUntil:
    visible: 'Profile, password, and notification preferences.'
    timeout: 40000
- scrollUntilVisible:
    element: 'Security'
    direction: DOWN
    timeout: 20000
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s02-05-settings-bottom
