# UI sweep s44 — Reports refused and Follow-ups as a mentor. Read-only: nothing is saved, the flow only
# opens, scrolls and looks; Mark done is never tapped.
# A mentor sees nothing season-shaped (owner, 2026-11-07): Reports is no tab of theirs and the
# screen refuses them, so the old all-seasons / one-season report states are gone. Follow-ups
# took its place in the mentor's bar.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${MENTOR_EMAIL}
- openLink: spacev2://reports
- extendedWaitUntil:
    visible: 'This screen is for season admins\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s44-01-reports-refused
# The seed flags no follow-up for the mentor (a note's follow-up flag notifies nobody), so the
# list shows its empty state: "0 open" under the title.
- openLink: spacev2://follow-ups
- extendedWaitUntil:
    visible: '\d+ open'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s44-02-follow-ups
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s44-03-follow-ups-bottom
