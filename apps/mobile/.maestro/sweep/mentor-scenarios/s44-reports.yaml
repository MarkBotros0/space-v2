# UI sweep s44 — Reports as a mentor, all seasons and one. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${MENTOR_EMAIL}
- openLink: spacev2://reports
- extendedWaitUntil:
    visible: '(Scoped to|Showing) .*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s44-01-reports
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s44-02-reports-mid
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s44-03-reports-bottom
- evalScript: ${output.year = new Date().getFullYear()}
- scrollUntilVisible:
    element: 'Season filter: GBV ${output.year}'
    direction: UP
    timeout: 20000
- tapOn: 'Season filter: GBV ${output.year}'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s44-04-reports-season
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s44-05-reports-season-bottom
