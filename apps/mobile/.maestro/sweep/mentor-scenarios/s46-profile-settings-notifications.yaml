# UI sweep s46 — More, Notifications and Notification settings as a mentor. Read-only: nothing is saved,
# the flow only opens, scrolls and looks. Sign out is shot, never tapped, and notification rows are never
# tapped (opening one marks it read).
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${MENTOR_EMAIL}
# More holds the name row (Profile), Announcements, Notifications, the theme and Sign out. Settings and
# Sign out are no longer on Profile.
- openLink: spacev2://more
- extendedWaitUntil:
    visible: 'Account, settings, and more places to go.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s46-01-more-top
- scrollUntilVisible:
    element: 'Announcements.*'
    direction: DOWN
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s46-02-more-announcements
- scrollUntilVisible:
    element: 'Notifications.*'
    direction: DOWN
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s46-03-more-notifications
# Last item has to clear the floating tab bar and the system bar.
- scrollUntilVisible:
    element: 'Sign out'
    direction: DOWN
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s46-04-more-sign-out
# Notification settings open from the gear on Notifications, not from More.
- openLink: spacev2://notifications
- extendedWaitUntil:
    visible: '\d+ unread'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s46-05-notifications
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Notification settings'
# The gear on Notifications carries the same words as the next screen's title, so wait on the
# settings screen's own text (section headers are upper-cased, so not "Push notifications").
- extendedWaitUntil:
    visible: 'Alerts on this device\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s46-06-notification-settings
# Last switch has to clear the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s46-07-notification-settings-bottom
