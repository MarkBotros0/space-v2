# UI sweep s45 — Notes as a mentor. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${MENTOR_EMAIL}
- openLink: spacev2://notes
- extendedWaitUntil:
    visible: '.*notes? you.ve authored'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s45-01-notes
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s45-02-notes-bottom
