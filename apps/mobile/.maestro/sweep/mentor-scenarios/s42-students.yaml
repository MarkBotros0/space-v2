# UI sweep s42 — Students and alumni as a mentor. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${MENTOR_EMAIL}
- openLink: spacev2://students
- extendedWaitUntil:
    visible: '\d+ students? in your seasons'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s42-01-students
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s42-02-students-bottom
- scrollUntilVisible:
    element: 'Search students'
    direction: UP
    timeout: 20000
- tapOn: 'Search students'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s42-03-students-search-kbd
- inputText: 'zzzz'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s42-04-students-search-typed
- tapOn: 'Search'
- extendedWaitUntil:
    visible: 'No students match your search\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s42-05-students-search-empty
# A mentor reaches Alumni from the Students header (no nav entry).
- openLink: spacev2://students/alumni
- extendedWaitUntil:
    visible: '\d+ graduated students? from your seasons'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s42-06-alumni
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s42-07-alumni-bottom
