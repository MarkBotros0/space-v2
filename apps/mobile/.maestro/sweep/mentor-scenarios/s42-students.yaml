# UI sweep s42 — Community (members) and alumni as a mentor. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${MENTOR_EMAIL}
# The mentor's /students is their Community: title "Community", count line "N members" (owner, 2026-11-07).
- openLink: spacev2://students
- extendedWaitUntil:
    visible: '\d+ members?'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s42-01-students
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s42-02-students-bottom
- scrollUntilVisible:
    element: 'Search members'
    direction: UP
    timeout: 20000
# The filter sheet: looked at only, Done and its rows are never tapped. Its "Who" choice
# (Everyone / Absent lately) is the mentor's own.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Filter.*'
- extendedWaitUntil:
    visible: '.*Missed their last two sessions.*'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s42-02b-students-filter-sheet
- back
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: 'Search members'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s42-03-students-search-kbd
- inputText: 'zzzz'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s42-04-students-search-typed
- extendedWaitUntil:
    visible: 'No members match your search\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s42-05-students-search-empty
# Alumni is a Show choice in the filter sheet, not a page (owner, 2026-11-07); ?show=alumni opens
# it on the same screen, which keeps the search typed above, so clear it first.
- tapOn: 'Search members'
- eraseText: 10
- hideKeyboard
- openLink: spacev2://students?show=alumni
# The mentor's count line says "N members" on every list, so wait for an alumnus row: only
# those say "School of <year>".
- extendedWaitUntil:
    visible: 'Aya Alumni, School of \d{4}.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s42-06-alumni
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s42-07-alumni-bottom
