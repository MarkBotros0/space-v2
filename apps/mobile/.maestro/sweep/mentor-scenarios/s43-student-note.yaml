# UI sweep s43 — A student's page and the note sheet as a mentor. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${MENTOR_EMAIL}
- openLink: spacev2://students
- extendedWaitUntil:
    visible: '\d+ students? in your seasons'
    timeout: 40000
# Salma: her submitted and reviewed work shows on the Submissions tab (drafts never do).
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Salma Student'
- extendedWaitUntil:
    visible: 'Seasons'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-01-student
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-02-student-mid
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-03-student-bottom
# Tabs. The row scrolls sideways: Notes is off screen until it is swiped. Each tab loads
# its data the first time it opens. The mentor's tab bar has a Notes tab too, under this
# pushed page, so Notes is picked as the one above the Submissions tab's first row.
- scrollUntilVisible:
    element: 'Seasons'
    direction: UP
    timeout: 20000
- tapOn: 'Seasons'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-04-tab-seasons
- tapOn: 'Attendance'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-05-tab-attendance
- tapOn: 'Submissions'
# At font 1.3 on a short phone the row starts below the fold. The row's own label also
# carries its season and status, hence the wildcard.
- scrollUntilVisible:
    element: 'Opening night reflection.*'
    direction: DOWN
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-06-tab-submissions
# Swiped from the middle tab: at font 1.3 'Submissions' sits against the right
# edge, where a gesture-nav swipe is the system Back gesture and leaves the page.
- swipe:
    from:
      text: 'Attendance'
    direction: LEFT
- swipe:
    from:
      text: 'Attendance'
    direction: LEFT
- tapOn:
    text: 'Notes'
    above: 'Opening night reflection.*'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-07-tab-notes
# The note sheet. Its "Visible to" label is not on any tab or the page, so waiting on
# it means the sheet is up. Add note is never tapped; back closes the sheet unsaved.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Write a note'
- extendedWaitUntil:
    visible: 'Visible to'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-08-note-sheet
- tapOn: 'Reflections.*'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-09-note-kbd
- inputText: 'Sweep note, never saved'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-10-note-typed
- back
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-11-note-dismissed
# Last item has to clear the system bar: this page has no floating tab bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-12-notes-bottom
