# UI sweep s43 — A member's page, the follow-up sheet and the note sheet as a mentor. Read-only: nothing is
# saved, the flow only opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${MENTOR_EMAIL}
- openLink: spacev2://students
- extendedWaitUntil:
    visible: '\d+ members?'
    timeout: 40000
# A row's label is "<name>, <university> · <faculty>", hence the wildcard.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Salma Student.*'
# The mentor's page (owner, 2026-11-07): Follow up, the details, then Notes (first, open) and
# Attendance. Nothing season-shaped: no figures, Submissions or Seasons. Salma has no open
# follow-up in the seed, so the page offers one.
- extendedWaitUntil:
    visible: 'Remind me to follow up'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-01-student
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-02-student-mid
# Last item has to clear the system bar (the student page has no tab bar).
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-03-student-bottom
# The follow-up sheet. "Remind me in a week" is never tapped; back closes the sheet unsaved.
- scrollUntilVisible:
    element: 'Remind me to follow up'
    direction: UP
    timeout: 20000
- tapOn: 'Remind me to follow up'
- extendedWaitUntil:
    visible: 'Follow up with Salma Student'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-04-follow-up-sheet
- tapOn: 'Why \(optional\)'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-05-follow-up-kbd
- hideKeyboard
- back
- waitForAnimationToEnd:
    timeout: 5000
# Notes is the first section and opens with the page. The note sheet: its "Visible to" label is
# not on the page, so waiting on it means the sheet is up. Add note is never tapped; back closes
# the sheet unsaved.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Write a note'
- extendedWaitUntil:
    visible: 'Visible to'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-06-note-sheet
- tapOn: 'Reflections.*'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-07-note-kbd
- inputText: 'Sweep note, never saved'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-08-note-typed
- back
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-09-note-dismissed
# Last item has to clear the system bar: this page has no floating tab bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-10-notes-bottom
# Attendance, grouped by season name. The segment may have scrolled off the top.
- scrollUntilVisible:
    element: 'Attendance'
    direction: UP
    timeout: 20000
- tapOn: 'Attendance'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-11-tab-attendance
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-12-attendance-bottom
