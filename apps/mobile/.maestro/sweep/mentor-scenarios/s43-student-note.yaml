# UI sweep s43 — A student's page and the note form as a mentor. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${MENTOR_EMAIL}
- openLink: spacev2://students
- extendedWaitUntil:
    visible: '\d+ students? in your seasons'
    timeout: 40000
# Salma: her submitted and reviewed work shows on the Submissions tab (drafts never do).
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Salma Student'
- extendedWaitUntil:
    visible: 'Seasons'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-01-student
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-02-student-mid
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-03-student-bottom
# Tabs. The mentor's tab bar has Notes and Profile tabs too, so Notes is picked as the one
# above the Submissions tab's first row.
- scrollUntilVisible:
    element: 'Seasons'
    direction: UP
    timeout: 20000
- tapOn: 'Seasons'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-04-tab-seasons
- tapOn: 'Attendance'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-05-tab-attendance
- tapOn: 'Submissions'
- extendedWaitUntil:
    visible: 'Opening night reflection'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-06-tab-submissions
- swipe:
    from:
      text: 'Attendance'
    direction: LEFT
- swipe:
    from:
      text: 'Attendance'
    direction: LEFT
- tapOn:
    text: 'Notes'
    above: 'Opening night reflection'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-07-tab-notes
# The note form: Add note is never tapped.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Reflections.*'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-08-note-kbd
- inputText: 'Sweep note, never saved'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-09-note-typed
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s43-10-note-form-bottom
