# UI sweep s41 — Dashboard as a mentor, with the user menu and the bell. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${MENTOR_EMAIL}
- openLink: spacev2://dashboard
- extendedWaitUntil:
    visible: 'Follow-ups due.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s41-01-dashboard
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s41-02-dashboard-mid
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s41-03-dashboard-bottom
# The user menu and the bell popover; Back closes each (rows and Mark all read are never tapped).
# Scrolled down: the in-content bell and user menu are gone, the compact header
# (titled "Home", R31) carries them once it has faded in.
- extendedWaitUntil:
    visible: 'Profile'
    timeout: 10000
- tapOn: 'Profile'
# The avatar opens Profile (owner, 2026-11-07), not a menu.
- extendedWaitUntil:
    visible: 'Edit profile'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s41-04-profile
- pressKey: back
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: 'Notifications.*'
# The bell opens the Notifications screen (owner, 2026-11-07), not a dropdown.
- extendedWaitUntil:
    visible: 'Notification settings'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s41-05-notification-bell
- pressKey: back
- waitForAnimationToEnd:
    timeout: 3000
