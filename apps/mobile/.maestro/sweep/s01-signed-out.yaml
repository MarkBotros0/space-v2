# UI sweep 01 — the signed-out screens: sign in, forgot password, reset
# password, accept invite, each empty and with the keyboard on its fields.
# Nothing is submitted: the backend shares its database with v1.
appId: com.jpc.space
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Welcome back'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s01-01-login

- tapOn:
    id: 'login-email'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s01-02-login-email-kbd
- inputText: 'student@example.com'
# FINDING (sweep 2026-10-19, small-1.3): with the keyboard open the sign-in
# page can't scroll — AuthCard's KeyboardAvoidingView has no Android behavior
# — so Password and Sign in stay under the keyboard. Close it to get on.
- hideKeyboard
- runFlow:
    file: _tap-id.yaml
    env:
      TARGET_ID: 'login-password'
- waitForAnimationToEnd:
    timeout: 3000
# The Sign in button has to be reachable above the keyboard.
- takeScreenshot: s01-03-login-password-kbd
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
# A band of padding left behind once the keyboard closes shows here.
- takeScreenshot: s01-04-login-filled

# ── Forgot password ──
- runFlow:
    file: _tap.yaml
    env:
      TARGET: 'Forgot password\?'
- extendedWaitUntil:
    visible: 'Forgot password'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s01-05-forgot
- tapOn: 'Email'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s01-06-forgot-email-kbd
- hideKeyboard

# ── Reset password ──
- runFlow:
    file: _tap.yaml
    env:
      TARGET: 'I have a reset code'
- extendedWaitUntil:
    visible: 'Reset password'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s01-07-reset
- tapOn: 'Confirm password'
- waitForAnimationToEnd:
    timeout: 3000
# The lowest field: is it, and the submit button, above the keyboard?
- takeScreenshot: s01-08-reset-confirm-kbd
- hideKeyboard
- runFlow:
    file: _tap.yaml
    env:
      TARGET: 'Back to sign in'

# ── Accept invite ──
- extendedWaitUntil:
    visible: 'Welcome back'
    timeout: 20000
- runFlow:
    file: _tap.yaml
    env:
      TARGET: 'I have an invite code'
- extendedWaitUntil:
    visible: 'Activate account'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s01-09-invite
- tapOn: 'Confirm password'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s01-10-invite-confirm-kbd
- hideKeyboard
