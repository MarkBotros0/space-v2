# UI sweep 90 - the hidden design catalogue (spacev2://design-catalogue), as a
# student: every redesign component in every state, each section scrolled
# fully on screen, the collapsed header, the toast, and a sheet with its
# keyboard. Needs a dev bundle or a build made with EXPO_PUBLIC_SWEEP_BUILD=1.
# Nothing is saved: the sheet's Save only closes it and the flow never taps it.
appId: com.jpc.space
---
- runFlow:
    file: _sign-in.yaml
    env:
      EMAIL: ${STUDENT_EMAIL}
- openLink: spacev2://design-catalogue
- extendedWaitUntil:
    visible: 'Every component in every state\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s90-00-top

- scrollUntilVisible:
    element:
      id: catalogue-type
    direction: DOWN
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s90-01-type

- scrollUntilVisible:
    element:
      id: catalogue-buttons
    direction: DOWN
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s90-02-buttons

- scrollUntilVisible:
    element:
      id: catalogue-chips
    direction: DOWN
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s90-03-chips

- scrollUntilVisible:
    element:
      id: catalogue-list
    direction: DOWN
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s90-04-list

- scrollUntilVisible:
    element:
      id: catalogue-hero
    direction: DOWN
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s90-05-hero

- scrollUntilVisible:
    element:
      id: catalogue-stats
    direction: DOWN
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s90-06-stats

- scrollUntilVisible:
    element:
      id: catalogue-controls
    direction: DOWN
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s90-07-controls

- scrollUntilVisible:
    element:
      id: catalogue-states
    direction: DOWN
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s90-08-states

- scrollUntilVisible:
    element:
      id: catalogue-toast
    direction: DOWN
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
# The toast lives ~4.3s (sonner-native's 4000ms + its 300ms entrance). A
# plain tapOn waits for the hierarchy to settle first, which on the CI
# emulator took ~5.8s, so the shot used to land after the toast had gone.
# Tap without the settle/retry and shoot as soon as the toast's text shows.
- tapOn:
    id: catalogue-toast-button
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: 'Nothing was written\.'
    timeout: 3000
- takeScreenshot: s90-09-toast

# The sheet section is the last: scrolled to the end, the title is collapsed
# into the pinned bar and the last section must clear the system bar.
- scrollUntilVisible:
    element:
      id: catalogue-open-sheet
    direction: DOWN
    centerElement: true
    timeout: 20000
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s90-10-collapsed-bottom

- runFlow:
    file: _tap-id.yaml
    env:
      TARGET_ID: catalogue-open-sheet
- extendedWaitUntil:
    visible: 'Add a note'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s90-11-sheet

- tapOn:
    id: catalogue-sheet-input
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s90-12-sheet-kbd
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000

# Close the sheet with the system Back (the sheet's onRequestClose), never Save.
- back
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: 'Add a note'
- takeScreenshot: s90-13-sheet-closed
