# UI sweep s06 — Work tab, Done, then a quiz, as a student. Read-only: nothing is saved,
# the flow only opens, scrolls and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${STUDENT_EMAIL}
- openLink: spacev2://work
- extendedWaitUntil:
    visible: 'Your current season'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: 'Done [0-9]+'
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-01-work-done
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-02-work-done-bottom
# Opens an online quiz if the student has one to take or resume. Nothing is
# answered or submitted.
- scrollUntilVisible:
    element: 'To do [0-9]+'
    direction: UP
    timeout: 5000
    optional: true
- tapOn:
    text: 'To do [0-9]+'
    optional: true
- scrollUntilVisible:
    element: '(Take quiz|Resume)'
    timeout: 5000
    optional: true
- tapOn:
    text: '(Take quiz|Resume)'
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-03-quiz-attempt
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-04-quiz-attempt-bottom
# An old link (a notification) shows Work on the stack: Back bar, no tab bar.
- openLink: spacev2://quizzes
- extendedWaitUntil:
    visible: 'Your current season'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-05-work-from-old-link
