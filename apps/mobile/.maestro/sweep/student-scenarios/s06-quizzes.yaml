# UI sweep s06 — My work's history and quizzes, then a quiz, as a student. Read-only: nothing is
# saved, the flow only opens, scrolls and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${STUDENT_EMAIL}
- openLink: spacev2://work
- extendedWaitUntil:
    visible: 'What to do, and what you handed in'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
# To do and Submitted are one screen now (owner, 2026-11-07): the old Done tab is
# the quizzes and history further down. The seeded online quiz is under Quizzes to take.
- scrollUntilVisible:
    element: 'QUIZZES TO TAKE'
    direction: DOWN
    centerElement: true
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-01-work-quizzes
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-02-work-done-bottom
# Opens the seeded online quiz (seed-sweep/activity.ts, not started). The quiz page
# shows its intro and "Start quiz", which creates an attempt, so it is never tapped:
# the attempt screen is not reachable without a write and has no shot.
- scrollUntilVisible:
    element: 'Week 2 check-in'
    direction: UP
    centerElement: true
    timeout: 10000
- tapOn: 'Week 2 check-in'
- extendedWaitUntil:
    visible: 'Start quiz'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-03-quiz-start
# An old link (a notification) shows My work on the stack: Back bar, no tab bar.
- openLink: spacev2://quizzes
- extendedWaitUntil:
    visible: 'What to do, and what you handed in'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-05-work-from-old-link
# The question-type quizzes (seed-sweep/quiz-types.ts). Quiz 3, "مراجعة الأسبوع الثالث", has the
# student's open attempt with an answer of every type, some unfinished. Picking an option or typing
# autosaves, so the flow only scrolls, focuses fields and chooses a matching item (which saves
# nothing until its match is tapped). Questions are in the authored order (shuffle off).
- openLink: spacev2://quiz/3
- extendedWaitUntil:
    visible: 'Submit quiz'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-06-attempt-single
- scrollUntilVisible:
    element: 'Choose 3 · 2 selected'
    direction: DOWN
    centerElement: true
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-07-attempt-choose-n
- scrollUntilVisible:
    element: 'True or false'
    direction: DOWN
    centerElement: true
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-08-attempt-true-false
- scrollUntilVisible:
    element: 'Tap an item, then its match\.'
    direction: DOWN
    centerElement: true
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-09-attempt-matching
# Choosing an unpaired item is local state: nothing is saved until its match is tapped, which never happens.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Match سفر الرؤيا with.*'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-10-attempt-matching-chosen
- scrollUntilVisible:
    element: 'Fill in the blank'
    direction: DOWN
    centerElement: true
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-11-attempt-blank
# Focus only (the first blank holds the saved "الطريق"): inline at 1.0, a "Blank 1" field under the sentence at 1.3.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'الطريق'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-12-attempt-blank-kbd
- hideKeyboard
- scrollUntilVisible:
    element: 'Which verse did we memorise in Week 2\?'
    direction: DOWN
    centerElement: true
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-13-attempt-mixed
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Answer 7'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-14-attempt-essay-kbd
- hideKeyboard
# The last card has to clear the pinned Submit bar and the system bar.
- runFlow: ../_scroll-end.yaml
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-15-attempt-bottom
# Quiz 6: submitted, waiting for marks. "Submitted" and nothing else: no question text.
- openLink: spacev2://quiz/6
- extendedWaitUntil:
    visible: 'Your score appears once it.s marked\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-16-submitted
# Quiz 4: graded, answers held. The score only.
- openLink: spacev2://quiz/4
- extendedWaitUntil:
    visible: 'Answers appear when your admin releases them\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-17-graded
# Quiz 5: answers released. The review, right or wrong per item with the correct answer.
- openLink: spacev2://quiz/5
- extendedWaitUntil:
    visible: 'Your answers are marked below\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-18-review-top
- scrollUntilVisible:
    element: 'Correct answer, not ticked'
    direction: DOWN
    centerElement: true
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-19-review-choose-n
- scrollUntilVisible:
    element: 'Your match: .*'
    direction: DOWN
    centerElement: true
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-20-review-matching
- scrollUntilVisible:
    element: 'Blank 2'
    direction: DOWN
    centerElement: true
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-21-review-blank
- scrollUntilVisible:
    element: 'Which verse did we memorise in Week 2\?'
    direction: DOWN
    centerElement: true
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-22-review-mixed
- runFlow: ../_scroll-end.yaml
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06-23-review-bottom
