# UI sweep s57 — Announcements as a student: Home's card, More's row, the feed (no New post button
# for a student) and a post. Needs the seeded posts (apps/backend/scripts/seed-sweep/announcements.ts).
# Also opens the poll post and shoots it before voting; Vote is never tapped.
# Read-only: nothing is saved. Opening a post marks it read, so the Home shot comes first.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${STUDENT_EMAIL}
- openLink: spacev2://dashboard
- extendedWaitUntil:
    visible: 'Hi, .*'
    timeout: 40000
# Opening the post below marks it read, so after the first cell of a run (shared sweep database)
# nothing is unread and Home rightly shows no card: the card shot is taken only when it is there.
- scrollUntilVisible:
    element: '(?s)\[Sweep\] This is fake text.*'
    direction: DOWN
    centerElement: true
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: '(?s)\[Sweep\] This is fake text.*'
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot: s57-01-home-card
- openLink: spacev2://more
- extendedWaitUntil:
    visible: 'Account, settings, and more places to go.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s57-02-more
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Announcements.*'
- extendedWaitUntil:
    visible: '(?s)\[Sweep\] This is fake text.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s57-03-feed
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s57-04-feed-bottom
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: '(?s)\[Sweep\] .*everyone in the community.*'
- extendedWaitUntil:
    visible: '(?s)\[Sweep\] This is fake text.*to check line breaks\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s57-05-post
# The poll post: back to the feed, open it, shoot the choices. No Vote tap.
- openLink: spacev2://announcements
- extendedWaitUntil:
    visible: 'Which evening suits the retreat.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Which evening suits the retreat.*'
- extendedWaitUntil:
    visible: 'Poll · Pick any'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s57-06-poll
