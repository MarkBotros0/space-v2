# UI sweep s04 — Season and calendar as a student. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${STUDENT_EMAIL}
- openLink: spacev2://season
# The student season page (StudentSeason) has no "Groups" heading; its
# eyebrow reads "Current season", in capitals on screen.
- extendedWaitUntil:
    visible: '(?i)current season'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s04-01-season
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s04-02-season-bottom
- openLink: spacev2://calendar
- extendedWaitUntil:
    visible: 'Calendar'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s04-03-calendar
# A session detail, reached by a row's "NN min" line on the Upcoming agenda
# (the page opens on it). Optional: an empty calendar has none, which is a
# state to report, not a failure.
- tapOn:
    text: '\d+ min'
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s04-04-session-detail
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s04-05-session-detail-bottom
# Back to the calendar, then the Month grid. It opens on "Upcoming", which has
# no previous/next arrows; switch to Month first, then step back one month.
- openLink: spacev2://calendar
- extendedWaitUntil:
    visible: 'Calendar'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: 'Month'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s04-06-calendar-month
- tapOn: 'Previous month'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s04-07-calendar-previous
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s04-08-calendar-bottom
