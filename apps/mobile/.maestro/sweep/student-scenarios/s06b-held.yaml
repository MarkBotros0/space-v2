# UI sweep s06b: held on an open quiz (docs/rules/quiz-integrity.md "Relaunch and the route lock").
# Read-only: nothing is saved, the flow only opens, scrolls, focuses fields and looks.
# The held student (STUDENT4_EMAIL, seed-sweep/held.ts) has quiz 3's every-type attempt open, so
# signing in lands on it by itself (the relaunch redirect), and a link elsewhere comes back to it.
# Then the classmate (STUDENT2_EMAIL) is held on quiz 9's running timed attempt: the countdown.
# Both emails come from the seed's users.json (seed-sweep.ts); the reference users have neither.
appId: com.jpc.space
---
# Not _sign-in.yaml: it waits for the shell's Profile tab, and a held student never sees the shell.
- runFlow:
    file: ../../login-as.yaml
    env:
      EMAIL: ${STUDENT4_EMAIL}
      PASSWORD: ${PASSWORD}
- extendedWaitUntil:
    visible: 'Submit quiz'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06b-01-relaunch-lands-on-quiz
# Any other route goes back to the quiz: My work comes straight back here.
- openLink: spacev2://work
- extendedWaitUntil:
    visible: 'Submit quiz'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06b-02-guard-back-to-quiz
# Quiz 3, "مراجعة الأسبوع الثالث": an answer of every type, some unfinished. Picking an option or
# typing autosaves, so the flow only scrolls, focuses fields and chooses a matching item (which saves
# nothing until its match is tapped). Questions are in the authored order (shuffle off).
- takeScreenshot: s06b-03-attempt-single
- scrollUntilVisible:
    element: 'Choose 3 · 2 selected'
    direction: DOWN
    centerElement: true
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06b-04-attempt-choose-n
- scrollUntilVisible:
    element: 'True or false'
    direction: DOWN
    centerElement: true
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06b-05-attempt-true-false
- scrollUntilVisible:
    element: 'Tap an item, then its match\.'
    direction: DOWN
    centerElement: true
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06b-06-attempt-matching
# Choosing an unpaired item is local state: nothing is saved until its match is tapped, which never happens.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Match سفر الرؤيا with.*'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06b-07-attempt-matching-chosen
- scrollUntilVisible:
    element: 'Fill in the blank'
    direction: DOWN
    centerElement: true
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06b-08-attempt-blank
# Focus only (the first blank holds the saved "الطريق"): inline at 1.0, a "Blank 1" field under the sentence at 1.3.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'الطريق'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06b-09-attempt-blank-kbd
- hideKeyboard
- scrollUntilVisible:
    element: 'Which verse did we memorise in Week 2\?'
    direction: DOWN
    centerElement: true
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06b-10-attempt-mixed
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Answer 7'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06b-11-attempt-essay-kbd
- hideKeyboard
# The last card has to clear the pinned Submit bar and the system bar.
- runFlow: ../_scroll-end.yaml
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06b-12-attempt-bottom
# Quiz 9: the classmate's timed attempt is running. The countdown sits in the pinned back bar and
# stays there as the questions scroll (owner, 2026-11-11). Nothing is answered.
- runFlow:
    file: ../../login-as.yaml
    env:
      EMAIL: ${STUDENT2_EMAIL}
      PASSWORD: ${PASSWORD}
- extendedWaitUntil:
    visible: 'Submit quiz'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06b-13-timed-countdown
- runFlow: ../_scroll-end.yaml
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s06b-14-timed-countdown-scrolled
