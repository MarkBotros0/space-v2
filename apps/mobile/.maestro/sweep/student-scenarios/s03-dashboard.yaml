# UI sweep s03 — Dashboard as a student. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${STUDENT_EMAIL}
- openLink: spacev2://dashboard
- extendedWaitUntil:
    visible: 'User menu'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s03-01-dashboard
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s03-02-dashboard-mid
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s03-03-dashboard-bottom
# Scrolled down: the in-content bell and user menu are gone, the compact header
# (titled "Today", R31) carries them once it has faded in.
- extendedWaitUntil:
    visible: 'User menu'
    timeout: 10000
- tapOn: 'User menu'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s03-04-user-menu
