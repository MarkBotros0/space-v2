# UI sweep s05 — Work tab, To do, then an assignment, as a student. Read-only: nothing
# is saved, the flow only opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${STUDENT_EMAIL}
- openLink: spacev2://work
- extendedWaitUntil:
    visible: 'Your current season'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s05-01-work-todo
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s05-02-work-todo-bottom
- scrollUntilVisible:
    element: '(Due|Overdue).*'
    direction: UP
    timeout: 10000
    optional: true
- tapOn:
    text: '(Due|Overdue).*'
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s05-03-assignment-detail
# Keyboard on the response box and its Save draft / Submit buttons. Never tap them.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Your response'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s05-04-assignment-response-kbd
- inputText: 'Sweep draft, never saved'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s05-05-assignment-typed
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s05-06-assignment-bottom
