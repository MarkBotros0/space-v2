# UI sweep s05 — My work (to do on top), then an assignment, as a student. Read-only: nothing
# is saved, the flow only opens, scrolls and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${STUDENT_EMAIL}
- openLink: spacev2://work
# My work (owner, 2026-11-07): one screen, to do first, then what was handed in.
- extendedWaitUntil:
    visible: 'What to do, and what you handed in'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s05-01-work-todo
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s05-02-work-todo-bottom
# The seeded overdue assignment (seed-sweep/activity.ts), with a draft behind it,
# so the page shows the editable response box rather than "Start working".
# Optional and not centred: the list is short, so the row is usually already on screen at the top,
# where it can't be centred (the centred scroll failed on the small phones).
- scrollUntilVisible:
    element: '(?s)Opening night reflection.*'
    direction: UP
    timeout: 10000
    optional: true
- tapOn: '(?s)Opening night reflection.*'
# The pinned bar (Start working, or Save draft / Submit) is the screen's footer.
- extendedWaitUntil:
    visible: '(Start working|Save draft|Submit)'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s05-03-assignment-detail
# Keyboard on the response box and its Save draft / Submit buttons. Never tap them.
# Nothing is typed: the editor writes a changed draft out on leaving and on going to
# the background (use-draft-flush.ts), so typed text would be saved when the flow ends.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Your response'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s05-04-assignment-response-kbd
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
# Last item has to clear the pinned bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s05-06-assignment-bottom
