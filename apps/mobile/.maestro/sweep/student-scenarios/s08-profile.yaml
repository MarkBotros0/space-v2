# UI sweep s08 — Profile as a student. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${STUDENT_EMAIL}
- openLink: spacev2://profile
- extendedWaitUntil:
    visible: 'Personal'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s08-01-profile
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Phone'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s08-02-profile-phone-kbd
- hideKeyboard
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Gifts / interests'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s08-03-profile-lowest-kbd
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s08-04-profile-after-kbd
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s08-05-profile-bottom
