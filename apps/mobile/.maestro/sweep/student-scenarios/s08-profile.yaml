# UI sweep s08 — Profile as a student: the read-only page top to bottom, then
# Edit profile with the phone pad and the lowest field (Graduation year).
# Read-only: nothing is saved, the flow only opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${STUDENT_EMAIL}
- openLink: spacev2://profile
# Profile is read-only (owner, 2026-11-07); its Edit pill is labelled "Edit profile".
- extendedWaitUntil:
    visible: 'Edit profile'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s08-01-profile
# Last item (the Academic card) has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s08-02-profile-bottom

- scrollUntilVisible:
    element: 'Edit profile'
    direction: UP
    timeout: 10000
- tapOn: 'Edit profile'
- extendedWaitUntil:
    visible: 'Save changes'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Phone'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s08-03-edit-phone-kbd
- hideKeyboard
# The phone pad often survives hideKeyboard on the CI emulator and covers the
# rest of the form. Its Done key closes it; Phone has no onSubmitEditing
# (src/screens/profile/personal-form.tsx), so nothing is submitted or saved.
- pressKey: Enter
# Graduation year is the last field. Swipe the left margin to the end first
# (Maestro's own scroll starts on a field and doesn't move the page here), so it
# sits above the pinned Save bar rather than under it.
- repeat:
    times: 6
    commands:
      - swipe:
          start: 4%, 70%
          end: 4%, 30%
          duration: 500
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: 'Graduation year'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s08-04-edit-lowest-kbd
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s08-05-edit-after-kbd
# Last field has to clear the pinned Save bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s08-06-edit-bottom
