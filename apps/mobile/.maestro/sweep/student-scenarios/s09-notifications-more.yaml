# UI sweep s09 — Notifications and More as a student. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${STUDENT_EMAIL}
- openLink: spacev2://notifications
- extendedWaitUntil:
    visible: 'Notifications'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s09-01-notifications
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s09-02-notifications-bottom
# Rows are never tapped: opening one marks it read.
- openLink: spacev2://more
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s09-03-more
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s09-04-more-bottom
