# UI sweep s51 — Today after a finished season, its season page and the three lists, as a student. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${FINISHED_EMAIL}
- openLink: spacev2://dashboard
- extendedWaitUntil:
    visible: '(?i)your last season'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s51-01-today-finished
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s51-02-today-finished-bottom
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'View your season'
- extendedWaitUntil:
    visible: 'Assignments \(.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s51-03-season-page
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s51-04-season-page-bottom
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Assignments \(.*'
- extendedWaitUntil:
    visible: 'Closing reflection'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s51-05-assignments-list
# Read-only: past work shows the record, no editor and no Submit.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Closing reflection'
- extendedWaitUntil:
    visible: '(?i)closing reflection'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s51-06-assignment-readonly
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s51-07-assignment-readonly-bottom
- back
- back
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Quizzes \(.*'
- extendedWaitUntil:
    visible: 'Final check-in'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s51-08-quizzes-list
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Final check-in'
- extendedWaitUntil:
    visible: '(?i)final check-in'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s51-09-quiz-readonly
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s51-10-quiz-readonly-bottom
- back
- back
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Attendance \(.*'
- extendedWaitUntil:
    visible: 'Last year.s finale'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s51-11-attendance-list
