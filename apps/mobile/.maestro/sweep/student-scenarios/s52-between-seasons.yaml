# UI sweep s52 — Today between seasons for a dropped student and a first-timer, and the between-seasons tabs. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${DROPPED_EMAIL}
- openLink: spacev2://dashboard
- extendedWaitUntil:
    visible: '.*not in a season right now.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s52-01-today-dropped
- openLink: spacev2://calendar
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s52-02-calendar-between
- openLink: spacev2://history
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s52-03-history-between
- openLink: spacev2://more
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s52-04-more-between
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${FRESH_EMAIL}
- openLink: spacev2://dashboard
- extendedWaitUntil:
    visible: 'Welcome to JPC Space'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s52-05-today-first-time
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s52-06-today-first-time-bottom
