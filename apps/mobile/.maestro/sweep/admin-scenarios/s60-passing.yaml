# UI sweep s60 — the Passing outlook as a season admin: who is on track and who is below the mark, the
# criteria, and the criteria sheet with the number keyboard on each field. Read-only: Save criteria is
# never tapped, the flow only opens, scrolls, types and looks. The seed (apps/backend/scripts/seed-sweep/
# activity.ts seedPassing) saves 40/30/30 and a mark of 60 on the Spring season, so both students are
# below the mark.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${ADMIN_EMAIL}
- evalScript: ${output.year = new Date().getFullYear()}
- openLink: spacev2://seasons/spring-${output.year}/passing
- extendedWaitUntil:
    visible: '\d+ below the mark'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s60-01-outlook
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s60-02-outlook-bottom
- scrollUntilVisible:
    element: 'Edit criteria'
    direction: UP
    centerElement: true
    timeout: 20000
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Edit criteria'
- extendedWaitUntil:
    visible: 'Attendance weight'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s60-03-criteria-sheet
- tapOn: 'Attendance weight'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s60-04-attendance-kbd
- tapOn: 'Assignments weight'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s60-05-assignments-kbd
- tapOn: 'Quizzes weight'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s60-06-quizzes-kbd
# A total that does not reach 100 shows "Not 100%" in words as well as colour.
- inputText: '9'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s60-07-total-not-100-kbd
- tapOn: 'Pass mark'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s60-08-pass-mark-kbd
- hideKeyboard
