# UI sweep s26 — Quizzes as a season admin. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
# Only Home has the user menu (R13): each screen is waited on by its own text.
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${ADMIN_EMAIL}
- openLink: spacev2://quizzes
- extendedWaitUntil:
    visible: 'All quizzes for .+'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-01-quizzes
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-02-quizzes-bottom
- openLink: spacev2://quiz/1
- extendedWaitUntil:
    visible: 'Grade this quiz'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-03-quiz-paper
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-04-quiz-paper-bottom
# Grading sheet: scores are typed, never saved.
- openLink: spacev2://quiz/1/grade
- extendedWaitUntil:
    visible: '.*Max score: \d+.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-05-quiz-grade
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-06-quiz-grade-bottom
- openLink: spacev2://quiz/2
- extendedWaitUntil:
    visible: 'Online · Published'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-07-quiz-online
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-08-quiz-online-bottom
- openLink: spacev2://quiz/2/edit
- extendedWaitUntil:
    visible: 'Edit quiz details'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-09-quiz-edit
# The builder shows a summary card; the title and settings open from its Edit pill (a sheet, never saved here).
- tapOn: 'Edit quiz details'
- extendedWaitUntil:
    visible: 'Quiz title'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-09a-quiz-details-sheet
# Already on screen in the sheet: _tap's scroll closed the sheet (it scrolled the page behind it).
- tapOn: 'Quiz title'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-10-quiz-edit-title-kbd
- inputText: 'x'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-11-quiz-edit-title-typed
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-12-quiz-edit-bottom
- openLink: spacev2://quiz/new
- extendedWaitUntil:
    visible: 'Add a quiz to this season\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-13-quiz-new
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Title'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-14-quiz-new-title-kbd
- inputText: 'Sweep quiz'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-15-quiz-new-title-typed
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-16-quiz-new-bottom
# The question-type quizzes (seed-sweep/quiz-types.ts). Quiz 5 has its answers released: the
# staff view shows every type's question and key in Arabic.
- openLink: spacev2://quiz/5
- extendedWaitUntil:
    visible: 'Online · Published'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-17-types-quiz
- scrollUntilVisible:
    element: 'Which verse did we memorise in Week 2\?'
    direction: DOWN
    centerElement: true
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-18-types-quiz-key
- runFlow: ../_scroll-end.yaml
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-19-types-quiz-bottom
# Quiz 4: graded, answers held, so the release card offers Release (never tapped).
- openLink: spacev2://quiz/4/grade
- extendedWaitUntil:
    visible: 'Max score: \d+'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-20-types-grade-held
# Quiz 7: a draft with no attempts, so every question opens its editor. Each is opened, looked
# at and cancelled; Save is never tapped.
- openLink: spacev2://quiz/7/edit
- extendedWaitUntil:
    visible: 'Edit quiz details'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-21-types-builder
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Edit question 1'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-22-edit-single
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Cancel'
# After the previous editor closes the page may sit past this row: scroll either way to it.
- scrollUntilVisible:
    element:
      text: 'Edit question 2'
    direction: UP
    centerElement: true
    timeout: 15000
    optional: true
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Edit question 2'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-23-edit-multi
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Cancel'
# After the previous editor closes the page may sit past this row: scroll either way to it.
- scrollUntilVisible:
    element:
      text: 'Edit question 3'
    direction: UP
    centerElement: true
    timeout: 15000
    optional: true
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Edit question 3'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-24-edit-true-false
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Cancel'
# After the previous editor closes the page may sit past this row: scroll either way to it.
- scrollUntilVisible:
    element:
      text: 'Edit question 4'
    direction: UP
    centerElement: true
    timeout: 15000
    optional: true
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Edit question 4'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-25-edit-matching
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Right item 5'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-26-edit-matching-kbd
# Reload instead of Cancel: on small-1.3 the keyboard may or may not be up here (Pair 5's field can sit
# under the pinned footer), so hideKeyboard can act as Back and Cancel can sit out of reach. Reloading
# drops the unsaved editor; nothing was saved. Home first: a link to the open route keeps it as it is.
- openLink: spacev2://dashboard
# The Home tab, not 'User menu': Home can come back scrolled, with the avatar in the fading compact header.
- extendedWaitUntil:
    visible: 'Home'
    timeout: 40000
- openLink: spacev2://quiz/7/edit
- extendedWaitUntil:
    visible: 'Edit quiz details'
    timeout: 40000
# After the previous editor closes the page may sit past this row: scroll either way to it.
- scrollUntilVisible:
    element:
      text: 'Edit question 5'
    direction: UP
    centerElement: true
    timeout: 15000
    optional: true
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Edit question 5'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-27-edit-blank
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Question prompt'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-28-edit-blank-kbd
- hideKeyboard
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Answer for blank 2'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-29-edit-blank-answer-kbd
- hideKeyboard
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Cancel'
# After the previous editor closes the page may sit past this row: scroll either way to it.
- scrollUntilVisible:
    element:
      text: 'Edit question 7'
    direction: UP
    centerElement: true
    timeout: 15000
    optional: true
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Edit question 7'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-30-edit-essay
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Cancel'
# A new question's type picker, then the empty matching editor (local; Add question is never tapped).
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Add question'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-31-add-question
# The type chip, not question 4's "Matching" status chip further up.
- scrollUntilVisible:
    element: 'Question type'
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    text: 'Matching'
    below: 'Question type'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-32-add-matching
# Timing in the details sheet (quiz 2: online; it has attempts in the seed now, so the time limit is locked). Each field is
# focused or opened and looked at; Save is never tapped.
- openLink: spacev2://quiz/2/edit
- extendedWaitUntil:
    visible: 'Edit quiz details'
    timeout: 40000
- tapOn: 'Edit quiz details'
- extendedWaitUntil:
    visible: 'Quiz title'
    timeout: 40000
- scrollUntilVisible:
    element: 'Time limit in minutes'
    direction: DOWN
    centerElement: true
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-33-details-timing
- tapOn: 'Time limit in minutes'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-34-details-time-limit-kbd
# Not hideKeyboard: quiz 2 has attempts in the seed now, so the limit is locked and no keyboard opens,
# and hideKeyboard with none up acts as Back and closes the sheet. Tapping the title is harmless.
- tapOn: 'Quiz details'
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: 'Can start from'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-35-details-start-from-picker
# Quiz 8: timed, and the classmate has started it, so the limit is locked and the window is not.
- openLink: spacev2://quiz/8/edit
- extendedWaitUntil:
    visible: 'Edit quiz details'
    timeout: 40000
- tapOn: 'Edit quiz details'
- extendedWaitUntil:
    visible: 'Quiz title'
    timeout: 40000
- scrollUntilVisible:
    element: 'Students have started this quiz, so its time limit can no longer change\.'
    direction: DOWN
    centerElement: true
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-36-details-time-limit-locked
# Quiz 8's grading: the classmate's open attempt has End attempt; its confirm is opened and cancelled.
- openLink: spacev2://quiz/8/grade
- extendedWaitUntil:
    visible: 'Max score: \d+'
    timeout: 40000
- scrollUntilVisible:
    element: 'End .*attempt'
    direction: DOWN
    centerElement: true
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-37-grade-end-attempt
- tapOn: 'End .*attempt'
- extendedWaitUntil:
    visible: 'Their saved answers are submitted\.'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-38-grade-end-confirm
- tapOn: 'Cancel'
# Quiz 4 carries an admin score below Samir's app score, with a note (seed-sweep/activity.ts). Only
# looks: Save score and Clear score are never tapped, the sheet is dismissed.
- openLink: spacev2://quiz/4/grade
- extendedWaitUntil:
    visible: 'Max score: \d+'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-39-admin-score-grade
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Samir Student.*'
- extendedWaitUntil:
    visible: 'Score entered by admin: .*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-40-attempt-sheet-admin-score
- tapOn: 'Edit manual score'
- extendedWaitUntil:
    visible: 'Clear score'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s26-41-score-sheet
- back
- waitForAnimationToEnd:
    timeout: 5000
