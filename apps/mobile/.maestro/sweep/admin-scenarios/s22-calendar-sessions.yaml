# UI sweep s22 — Calendar and sessions as a season admin. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
# Only Home has the user menu (R13): each screen is waited on by its own text.
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${ADMIN_EMAIL}
- openLink: spacev2://calendar
- extendedWaitUntil:
    visible: 'Add session'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s22-01-calendar
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s22-02-calendar-bottom
# An agenda row's label is "<title>, <time> · <length> · <place>", hence the wildcard.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Week 2: Calling.*'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s22-03-session-upcoming
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s22-04-session-upcoming-bottom
# The past session is not in the Upcoming agenda, so it is opened by id (seed order: Opening night is session 1).
- openLink: spacev2://session/1
- extendedWaitUntil:
    visible: 'Opening night'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s22-05-session-past
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s22-06-session-past-bottom
# Attendance sheet: rows are never tapped and Save is never pressed.
- openLink: spacev2://session/1/attendance
- extendedWaitUntil:
    visible: 'Quick mark all as'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s22-07-session-attendance
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s22-08-session-attendance-bottom
- openLink: spacev2://session/1/edit
- extendedWaitUntil:
    visible: 'Edit session'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s22-09-session-edit
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Title'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s22-10-session-edit-title-kbd
- inputText: 'x'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s22-11-session-edit-title-typed
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s22-12-session-edit-bottom
# New session and group need ?seasonId=; the seeded current season is id 2.
- openLink: spacev2://session/new?seasonId=2
- extendedWaitUntil:
    visible: 'Repeat weekly for…|Title'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s22-13-session-new
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Title'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s22-14-session-new-title-kbd
- inputText: 'Sweep session'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s22-15-session-new-title-typed
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s22-16-session-new-bottom
