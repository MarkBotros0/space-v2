# UI sweep s54 — End season as a season admin: overdue callout, blockers, review list, result sheet with the keyboard. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${ADMIN_EMAIL}
- openLink: spacev2://dashboard
# Home leads with the season ring, then Announcements and the next session (owner,
# 2026-11-08), so the overdue callout ("Spring Intensive <year> has ended") is below the
# fold on the small phone: wait for the ring, then bring the callout to the centre.
- extendedWaitUntil:
    visible: 'Sessions held.*'
    timeout: 40000
- scrollUntilVisible:
    element: '.* has ended'
    direction: DOWN
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s54-01-today-overdue-callout
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s54-02-today-overdue-callout-bottom
- evalScript: ${output.year = new Date().getFullYear()}
- openLink: spacev2://seasons/gbv-${output.year}/end
- extendedWaitUntil:
    visible: 'Finish these first'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s54-03-end-blockers
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s54-04-end-blockers-bottom
- openLink: spacev2://seasons/spring-${output.year}/end
- extendedWaitUntil:
    visible: 'Everyone passes unless.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s54-05-end-review
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s54-06-end-review-bottom
# The confirm dialog and End season itself are never opened: they write. A review row's label
# is "Sami Spring, Spring Group · N% attendance, Passed", hence the wildcard.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Sami Spring.*'
- extendedWaitUntil:
    visible: 'Result for Sami Spring'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s54-07-result-sheet
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Did not pass'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s54-08-result-sheet-not-passed
- tapOn: 'Reason'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s54-09-result-sheet-kbd
- inputText: 'Missed most of the sessions and did not hand anything in this season.'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s54-10-result-sheet-typed-kbd
- hideKeyboard
