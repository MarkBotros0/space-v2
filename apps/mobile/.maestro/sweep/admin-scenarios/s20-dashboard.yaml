# UI sweep s20 — Dashboard as a season admin. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${ADMIN_EMAIL}
- openLink: spacev2://dashboard
- extendedWaitUntil:
    visible: 'Sessions held.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s20-01-dashboard
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s20-02-dashboard-mid
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s20-03-dashboard-bottom
# Scrolled down: the in-content bell and user menu are gone, the compact header
# (titled "Hi, <first name>", or "Home" when the name is unknown; R31) carries them once it has faded in.
- extendedWaitUntil:
    visible: 'Profile'
    timeout: 10000
- tapOn: 'Profile'
# The avatar opens Profile (owner, 2026-11-07), not a menu.
- extendedWaitUntil:
    visible: 'Edit profile'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s20-04-profile
