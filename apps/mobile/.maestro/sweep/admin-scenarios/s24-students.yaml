# UI sweep s24 — Students as a season admin. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${ADMIN_EMAIL}
- openLink: spacev2://students
- extendedWaitUntil:
    visible: 'User menu'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-01-students
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-02-students-bottom
- openLink: spacev2://students/dropped
- extendedWaitUntil:
    visible: 'User menu'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-03-dropped
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-04-dropped-bottom
- openLink: spacev2://students/alumni
- extendedWaitUntil:
    visible: 'User menu'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-05-alumni
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-06-alumni-bottom
- openLink: spacev2://students
- extendedWaitUntil:
    visible: 'User menu'
    timeout: 40000
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Samir Student'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-07-student-detail
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-08-student-detail-mid
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-09-student-detail-bottom
# Note form lives on the Notes tab: type, never tap Add note.
- scrollUntilVisible:
    element: 'Attendance'
    direction: UP
    timeout: 10000
    optional: true
- swipe:
    from: 'Attendance'
    direction: LEFT
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Notes'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-10-student-notes-tab
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Note'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-11-student-note-kbd
- inputText: 'Sweep note, never saved'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-12-student-note-typed
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-13-student-note-bottom
# Student ids follow the seed order: super 1, admin 2, leader 3, mentor 4, student 5.
- openLink: spacev2://student/5/edit
- extendedWaitUntil:
    visible: 'User menu'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-14-student-edit
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Full name'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-15-student-edit-name-kbd
- inputText: 'x'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-16-student-edit-name-typed
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-17-student-edit-bottom
