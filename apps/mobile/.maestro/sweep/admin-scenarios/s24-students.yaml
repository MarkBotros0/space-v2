# UI sweep s24 — Students as a season admin. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
# Only Home has the user menu (R13): each screen is waited on by its own text.
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${ADMIN_EMAIL}
- openLink: spacev2://students
- extendedWaitUntil:
    visible: '\d+ students? in your seasons'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-01-students
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-02-students-bottom
# Dropped and Alumni are a Show choice in the filter sheet, not pages (owner, 2026-11-07);
# ?show= opens the list on one.
- openLink: spacev2://students?show=dropped
# Same screen as the list above, so it may keep its scroll position: back up to the count.
- scrollUntilVisible:
    element: '\d+ students? dropped from your seasons'
    direction: UP
    timeout: 15000
    optional: true
- extendedWaitUntil:
    visible: '\d+ students? dropped from your seasons'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-03-dropped
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-04-dropped-bottom
- openLink: spacev2://students?show=alumni
# Same screen as the list above, so it may keep its scroll position: back up to the count.
- scrollUntilVisible:
    element: '\d+ graduated students? from your seasons'
    direction: UP
    timeout: 15000
    optional: true
- extendedWaitUntil:
    visible: '\d+ graduated students? from your seasons'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-05-alumni
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-06-alumni-bottom
# show=active, not a bare link: a link to the same screen may keep the last ?show= param.
- openLink: spacev2://students?show=active
# The Students tab keeps its scroll position (the three scrolls above), so the
# count under the title is off screen on the small phone: scroll back up to it.
- scrollUntilVisible:
    element: '\d+ students? in your seasons'
    direction: UP
    timeout: 15000
    optional: true
- extendedWaitUntil:
    visible: '\d+ students? in your seasons'
    timeout: 40000
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Samir Student.*'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-07-student-detail
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-08-student-detail-mid
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-09-student-detail-bottom
# The sections are one segmented control (Submissions, Attendance, Notes, Seasons): no swiping.
# The note is written in a sheet behind "Write a note": type, never tap Add note.
- scrollUntilVisible:
    element: 'Attendance'
    direction: UP
    timeout: 10000
    optional: true
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Notes'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-10-student-notes-tab
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Write a note'
- extendedWaitUntil:
    visible: 'Flag for admin follow-up'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Reflections.*'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-11-student-note-kbd
- inputText: 'Sweep note, never saved'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-12-student-note-typed
# The sheet is dismissed with Back; Add note is never tapped.
- pressKey: back
- waitForAnimationToEnd:
    timeout: 5000
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-13-student-notes-bottom
# Student ids follow the seed order: super 1, admin 2, leader 3, mentor 4, student 5.
- openLink: spacev2://student/5/edit
- extendedWaitUntil:
    visible: 'Edit Samir Student'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-14-student-edit
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Full name'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-15-student-edit-name-kbd
- inputText: 'x'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-16-student-edit-name-typed
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s24-17-student-edit-bottom
