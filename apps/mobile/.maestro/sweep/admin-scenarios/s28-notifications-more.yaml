# UI sweep s28 — Notifications, More and Notification settings as a season admin. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
# Only Home has the user menu (R13): each screen is waited on by its own text.
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${ADMIN_EMAIL}
- openLink: spacev2://notifications
- extendedWaitUntil:
    visible: '\d+ unread'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s28-01-notifications
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s28-02-notifications-bottom
# Rows are never tapped: opening one marks it read.
- openLink: spacev2://more
- extendedWaitUntil:
    visible: 'Account, settings, and more places to go\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s28-03-more
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s28-04-more-bottom
# There is no Settings page any more: Profile is /profile (s20), the theme and Sign out are on
# More, and Notification settings open from the gear on Notifications. Switches are never tapped.
- openLink: spacev2://settings/notifications
- extendedWaitUntil:
    visible: 'Alerts on this device\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s28-05-notification-settings
# Last switch has to clear the system bar.
- runFlow:
    file: ../_scroll-end.yaml
- takeScreenshot: s28-06-notification-settings-bottom
