# UI sweep s36 — Alumni and dropped students as a super admin. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${SUPER_EMAIL}
# Alumni and Dropped are a Show choice on the Students list now, not pages (owner, 2026-11-07).
- openLink: spacev2://students?show=alumni
- extendedWaitUntil:
    visible: '\d+ graduated students? from your seasons'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s36-01-alumni
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s36-02-alumni-bottom
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Aya Alumni'
- extendedWaitUntil:
    visible: 'Edit profile'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s36-03-alumnus-detail
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s36-04-alumnus-detail-bottom
- openLink: spacev2://students?show=dropped
- extendedWaitUntil:
    visible: '\d+ students? dropped from your seasons'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s36-05-dropped
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s36-06-dropped-bottom
