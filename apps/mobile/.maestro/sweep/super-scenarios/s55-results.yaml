# UI sweep s55 — Results of a finished season as a super admin, the corrections sheet with the keyboard, and Today. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${SUPER_EMAIL}
- evalScript: ${output.year = new Date().getFullYear() - 1}
- openLink: spacev2://seasons/gbv-${output.year}
- extendedWaitUntil:
    visible: 'Code: gbv-.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s55-01-finished-season-detail
- openLink: spacev2://seasons/gbv-${output.year}/results
- extendedWaitUntil:
    visible: 'Fady Finished'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s55-02-results
# The sweep's finished season was seeded straight into the database, so it has no stored score:
# each row says so (a season ended with weighted passing shows "Score 72.5" and, against it, "Passed
# below the mark" instead).
- extendedWaitUntil:
    visible: 'Ended before weighted passing'
    timeout: 40000
- takeScreenshot: s55-02a-results-score-labels
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Fady Finished'
- extendedWaitUntil:
    visible: 'Save result'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s55-03-result-sheet
- tapOn: 'Reason'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s55-04-result-sheet-kbd
- hideKeyboard
- openLink: spacev2://dashboard
- extendedWaitUntil:
    visible: 'Profile'
    timeout: 40000
# Super Home (owner, 2026-11-08): Community tiles, season rings, announcements, then the overdue
# callout, so it is below the fold: scroll down to it.
- scrollUntilVisible:
    element: '.* has ended'
    direction: DOWN
    centerElement: true
    timeout: 20000
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s55-05-today-overdue-callout
