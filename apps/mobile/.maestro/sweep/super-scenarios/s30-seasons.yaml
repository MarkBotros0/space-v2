# UI sweep s30 — Seasons list and season detail as a super admin. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${SUPER_EMAIL}
- openLink: spacev2://seasons
- extendedWaitUntil:
    visible: 'Seasons'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-01-seasons
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-02-seasons-bottom
# The seeded seasons are gbv-<this year> (active) and gbv-<last year> (completed).
- evalScript: ${output.year = new Date().getFullYear()}
- evalScript: ${output.prev = new Date().getFullYear() - 1}
- openLink: spacev2://seasons/gbv-${output.year}
- extendedWaitUntil:
    visible: 'Code: gbv-${output.year}'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-03-season-overview
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-04-season-overview-bottom
# The Admins section, then its picker opened. Nothing is added: the flow leaves without Add admin.
- scrollUntilVisible:
    element: 'Choose an admin.*'
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-04a-season-admins
- tapOn: 'Choose an admin.*'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-04b-admin-picker
- pressKey: back
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element: 'Groups'
    direction: UP
    timeout: 20000
- tapOn: 'Groups'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-05-season-groups
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Group A'
- extendedWaitUntil:
    visible: 'Tuesday evening group'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-06-group-detail
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-07-group-detail-bottom
# Back to the season: the link may land on the screen already mounted, scrolled. Wait until
# the group page has gone, then scroll up until the season's own 'Code:' line shows (it is
# found at once when the screen opens at the top), then on to the tabs.
- openLink: spacev2://seasons/gbv-${output.year}
- extendedWaitUntil:
    notVisible: 'Tuesday evening group'
    timeout: 40000
- scrollUntilVisible:
    element: 'Code: gbv-${output.year}'
    direction: UP
    timeout: 40000
- scrollUntilVisible:
    element: 'Sessions'
    direction: UP
    timeout: 20000
- tapOn: 'Sessions'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-08-season-sessions
# The upcoming session's row opens its page; Mark attendance is never tapped.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Week 2: Calling'
- extendedWaitUntil:
    visible: 'Bring a notebook\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-09-session-detail
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-10-session-detail-bottom
- openLink: spacev2://seasons/gbv-${output.prev}
- extendedWaitUntil:
    visible: 'Code: gbv-${output.prev}'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-11-past-season
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-12-past-season-bottom
