# UI sweep s30 — Seasons list and season detail as a super admin. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${SUPER_EMAIL}
- openLink: spacev2://seasons
- extendedWaitUntil:
    visible: 'Seasons'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-01-seasons
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-02-seasons-bottom
# The seeded seasons are gbv-<this year> (active) and gbv-<last year> (completed).
- evalScript: ${output.year = new Date().getFullYear()}
- evalScript: ${output.prev = new Date().getFullYear() - 1}
- openLink: spacev2://seasons/gbv-${output.year}
- extendedWaitUntil:
    visible: 'Code: gbv-${output.year}'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-03-season-overview
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-04-season-overview-bottom
# The People card (owner, 2026-11-07): admins, students, groups, all on the overview. Its
# Admins level carries Manage, which opens /seasons/[code]/admins; Add admin opens the
# picker sheet. Nothing is added: the flow leaves the sheet without picking anyone.
- scrollUntilVisible:
    element: 'Manage admins'
    direction: UP
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-04a-season-people
- tapOn: 'Manage admins'
- extendedWaitUntil:
    visible: 'Add admin'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-04b-season-admins
- tapOn: 'Add admin'
- extendedWaitUntil:
    visible: 'Search people'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-04c-admin-picker
# Back closes the sheet, Back again returns to the season.
- pressKey: back
- waitForAnimationToEnd:
    timeout: 5000
- pressKey: back
- extendedWaitUntil:
    visible: 'Code: gbv-${output.year}'
    timeout: 40000
# Groups are branches inside the People card; a branch is one button labelled with the
# group's name, its leader and its count.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Group A, .*'
- extendedWaitUntil:
    visible: 'Tuesday evening group'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-06-group-detail
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-07-group-detail-bottom
# Sessions is a Manage tile now, opening /seasons/[code]/sessions. Opened by its link: the
# word "Sessions" is also the figures card's label, so a tap by text could land on the figure.
- openLink: spacev2://seasons/gbv-${output.year}/sessions
- extendedWaitUntil:
    notVisible: 'Tuesday evening group'
    timeout: 40000
- extendedWaitUntil:
    visible: 'Sessions'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-08-season-sessions
# The upcoming session's row opens its page; Mark attendance is never tapped.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Week 2: Calling'
- extendedWaitUntil:
    visible: 'Bring a notebook\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-09-session-detail
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-10-session-detail-bottom
- openLink: spacev2://seasons/gbv-${output.prev}
- extendedWaitUntil:
    visible: 'Code: gbv-${output.prev}'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-11-past-season
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s30-12-past-season-bottom
