# UI sweep s37 — Users, a user in each account state and the new-user form as a super admin. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${SUPER_EMAIL}
- openLink: spacev2://users
- extendedWaitUntil:
    visible: '\d+ total'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s37-01-users
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s37-02-users-mid
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s37-03-users-bottom
- scrollUntilVisible:
    element: 'Search'
    direction: UP
    timeout: 20000
- tapOn: 'Search'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s37-04-users-search-kbd
# A search is a read: Enter runs it and shows the no-match state.
- inputText: 'zzzz'
- pressKey: Enter
- extendedWaitUntil:
    visible: 'No accounts match this search\.'
    timeout: 40000
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s37-05-users-search-empty
# Rows open by their label; Send invite and the bulk invite button are never tapped.
# Seed order: Adam Admin 2, Ivy Invited 10 (live invite), Omar Offboarded 11 (deactivated),
# Peter Pending 9 (never invited).
- openLink: spacev2://user/2
- extendedWaitUntil:
    visible: 'Edit Adam Admin'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s37-06-user-active
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Name'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s37-07-user-active-name-kbd
- hideKeyboard
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Role'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s37-08-user-role-open
- pressKey: back
- waitForAnimationToEnd:
    timeout: 3000
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s37-09-user-active-bottom
# Save changes and Deactivate are never tapped.
- openLink: spacev2://user/10
- extendedWaitUntil:
    visible: 'Edit Ivy Invited'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s37-10-user-invited
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s37-11-user-invited-bottom
- openLink: spacev2://user/11
- extendedWaitUntil:
    visible: 'Edit Omar Offboarded'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s37-12-user-inactive
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s37-13-user-inactive-bottom
- openLink: spacev2://user/9
- extendedWaitUntil:
    visible: 'Edit Peter Pending'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s37-14-user-pending
- openLink: spacev2://users/new
- extendedWaitUntil:
    visible: 'They.ll get an email invite.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s37-15-user-new
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Name'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s37-16-user-new-name-kbd
- inputText: 'Sweep User'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s37-17-user-new-name-typed
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Role'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s37-18-user-new-role-open
- pressKey: back
- waitForAnimationToEnd:
    timeout: 3000
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s37-19-user-new-bottom
# Create and send invite is never tapped.
