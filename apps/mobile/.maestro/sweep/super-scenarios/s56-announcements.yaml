# UI sweep s56 — Announcements as a super admin: Home's card, More's row, the feed, a post, the
# New announcement form with the keyboard open on Message, and its confirm sheet (then Cancel).
# Needs the seeded posts (apps/backend/scripts/seed-sweep/announcements.ts). Read-only: nothing is
# posted or saved; Post is tapped only to open the confirm sheet, and the sheet's Post is never
# tapped. Also opens the poll post (See who voted) and the form's Add a poll; nothing is voted or saved. Opening a post marks it read, so the Home shot comes first.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${SUPER_EMAIL}
- openLink: spacev2://dashboard
- extendedWaitUntil:
    visible: '(?i)community'
    timeout: 40000
- scrollUntilVisible:
    element: '(?s)\[Sweep\] .*everyone in the community.*'
    direction: DOWN
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s56-01-home-card
- openLink: spacev2://more
- extendedWaitUntil:
    visible: 'Account, settings, and more places to go.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s56-02-more
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Announcements.*'
- extendedWaitUntil:
    visible: '(?s)\[Sweep\] .*everyone in the community.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s56-03-feed
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s56-04-feed-bottom
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: '(?s)\[Sweep\] .*everyone in the community.*'
- extendedWaitUntil:
    visible: 'This is fake text for the UI sweep.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s56-05-post
- openLink: spacev2://announcements/new
- extendedWaitUntil:
    visible: 'New announcement'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s56-06-new
- tapOn: 'Message'
- inputText: 'Sweep test message, never posted.'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s56-07-new-message-kbd
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
# Post only opens the confirm sheet; the sheet's Post is never tapped.
- tapOn: 'Post'
- extendedWaitUntil:
    visible: 'Post to Everyone\?'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s56-08-confirm-sheet
- tapOn: 'Cancel'
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: 'Post to Everyone\?'
- takeScreenshot: s56-09-confirm-cancelled
# The poll post as a manager: results with counts, then who voted (a sheet; closed without saving).
- openLink: spacev2://announcements
- extendedWaitUntil:
    visible: 'Which evening suits the retreat.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Which evening suits the retreat.*'
- extendedWaitUntil:
    visible: 'Poll.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s56-10-poll
- tapOn: 'See who voted'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s56-11-poll-voters
# The composer's poll section: Add a poll opens it; nothing is posted.
- openLink: spacev2://announcements/new
- extendedWaitUntil:
    visible: 'New announcement'
    timeout: 40000
- scrollUntilVisible:
    element: 'Add a poll'
    direction: DOWN
    timeout: 20000
- tapOn: 'Add a poll'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s56-12-new-poll
