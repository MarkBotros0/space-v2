# UI sweep s39 — Reports as a super admin: the Season view (it opens on a current season, History
# for the others and All seasons; owner 2026-11-07), then the Organisation view. Read-only:
# nothing is saved, the flow only opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${SUPER_EMAIL}
- openLink: spacev2://reports
# The season card's History pill sits at the top and stays put.
- extendedWaitUntil:
    visible: 'Choose another season'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s39-01-reports
# The figures come first, so the at-risk card (or the empty state) is below the fold on a small
# phone: scroll to it. Not optional, so a screen that renders neither still fails here.
- scrollUntilVisible:
    element: 'Students at risk.*|Nothing to report yet'
    direction: DOWN
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s39-02-reports-mid
# Last item has to clear the floating tab bar and the system bar.
- runFlow:
    file: ../_scroll-end.yaml
- takeScreenshot: s39-03-reports-bottom
# Picking a season is a read. Export is never tapped (it opens the share sheet).
- scrollUntilVisible:
    element: 'Choose another season'
    direction: UP
    timeout: 60000
- tapOn: 'Choose another season'
- extendedWaitUntil:
    visible: 'Every season together'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s39-04-reports-history
- tapOn: 'All seasons'
- extendedWaitUntil:
    visible: 'Every season together \(\d+\)'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s39-05-reports-all-seasons
# Last item has to clear the floating tab bar and the system bar.
- runFlow:
    file: ../_scroll-end.yaml
- takeScreenshot: s39-06-reports-all-seasons-bottom
- scrollUntilVisible:
    element: 'Organisation'
    direction: UP
    timeout: 60000
- tapOn: 'Organisation'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s39-07-reports-organisation
# Last item has to clear the floating tab bar and the system bar.
- runFlow:
    file: ../_scroll-end.yaml
- takeScreenshot: s39-08-reports-organisation-bottom
