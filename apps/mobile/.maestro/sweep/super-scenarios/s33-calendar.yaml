# UI sweep s33 — Calendar as a super admin: every view and a session from it. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${SUPER_EMAIL}
- openLink: spacev2://calendar
- extendedWaitUntil:
    visible: 'All active seasons across JPC\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s33-01-calendar
- tapOn: 'Week'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s33-02-calendar-week
- tapOn: 'Month'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s33-03-calendar-month
- tapOn: 'Previous month'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s33-04-calendar-previous-month
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s33-05-calendar-bottom
# The same screen again, still on Month and scrolled: scroll up to the view switch.
- openLink: spacev2://calendar
- extendedWaitUntil:
    visible: 'User menu'
    timeout: 40000
- scrollUntilVisible:
    element: 'Upcoming'
    direction: UP
    timeout: 20000
- tapOn: 'Upcoming'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s33-06-calendar-upcoming
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Week 2: Calling'
- extendedWaitUntil:
    visible: 'Bring a notebook\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s33-07-calendar-session-detail
