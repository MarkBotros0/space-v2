# UI sweep s40 — My notes, notifications, More, Edit profile and notification settings as a super admin. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${SUPER_EMAIL}
- openLink: spacev2://notes
- extendedWaitUntil:
    visible: '.*notes? you.ve authored'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s40-01-notes
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s40-02-notes-bottom
# Rows are never tapped: opening one marks it read.
- openLink: spacev2://notifications
- extendedWaitUntil:
    visible: '\d+ unread'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s40-03-notifications
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s40-04-notifications-bottom
- openLink: spacev2://more
- extendedWaitUntil:
    visible: 'Account, settings, and more places to go\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s40-05-more
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s40-06-more-bottom
# There is no Settings page any more (owner, 2026-11-07): the profile form is /edit-profile
# (Profile's Edit) and notification settings open from the gear on Notifications. Save is never
# tapped, and no switch is flipped.
- openLink: spacev2://edit-profile
- extendedWaitUntil:
    visible: 'Edit profile'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s40-07-edit-profile
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Name'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s40-08-edit-profile-name-kbd
- hideKeyboard
# Last item has to clear the pinned Save bar and the system bar.
- runFlow:
    file: ../_scroll-end.yaml
- takeScreenshot: s40-09-edit-profile-bottom
- openLink: spacev2://settings/notifications
- extendedWaitUntil:
    visible: 'Notification settings'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s40-10-notification-settings
- runFlow:
    file: ../_scroll-end.yaml
- takeScreenshot: s40-11-notification-settings-bottom
