# UI sweep s34 — JPC events, the new-event sheet and an event's edit sheet as a super admin. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${SUPER_EMAIL}
- openLink: spacev2://events
- extendedWaitUntil:
    visible: 'Organisation-wide events visible.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s34-01-events
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s34-02-events-bottom
# New event opens the form in a sheet; Create event is never tapped, back closes the sheet.
- scrollUntilVisible:
    element: 'New event'
    direction: UP
    timeout: 20000
- tapOn: 'New event'
- extendedWaitUntil:
    visible: 'New JPC event'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s34-03-event-new
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Title'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s34-04-event-new-title-kbd
- inputText: 'Sweep event'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s34-05-event-new-title-typed
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Visible to'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s34-06-event-new-visibility-open
- pressKey: back
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Date'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s34-07-event-new-date-open
- pressKey: back
- waitForAnimationToEnd:
    timeout: 3000
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s34-08-event-new-bottom
- pressKey: back
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: 'Organisation-wide events visible.*'
    timeout: 40000
# Seed order: event 1 is Sweep kickoff event (all members), event 2 the alumni-only one.
- openLink: spacev2://event/1
- extendedWaitUntil:
    visible: 'Fake organisation-wide event for the UI sweep\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s34-09-event-detail
# Edit opens the form in a sheet; Save changes and Delete event are never tapped.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Edit'
- extendedWaitUntil:
    visible: 'Edit event'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s34-10-event-edit
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Title'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s34-11-event-edit-title-kbd
- hideKeyboard
# Last field has to clear the sheet's pinned Save changes bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s34-12-event-edit-bottom
- pressKey: back
- waitForAnimationToEnd:
    timeout: 3000
- openLink: spacev2://event/2
- extendedWaitUntil:
    visible: 'Fake alumni-only event for the UI sweep\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s34-13-event-alumni-only
