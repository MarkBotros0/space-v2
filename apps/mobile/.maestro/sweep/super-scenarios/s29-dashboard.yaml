# UI sweep s29 — Dashboard as a super admin (an overview: seasons and community, no work queues;
# owner 2026-11-07), with the user menu and the bell, then a running season's Needs attention. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${SUPER_EMAIL}
- openLink: spacev2://dashboard
- extendedWaitUntil:
    visible: '(?i)community'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s29-01-dashboard
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s29-02-dashboard-mid
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s29-03-dashboard-bottom
# The user menu and the bell popover; Back closes each (rows and Mark all read are never tapped).
# Scrolled down: the in-content bell and user menu are gone, the compact header
# (titled "Hi, <first name>", or "Home" when the name is unknown; R31) carries them once it has faded in.
- extendedWaitUntil:
    visible: 'Profile'
    timeout: 10000
- tapOn: 'Profile'
# The avatar opens Profile (owner, 2026-11-07), not a menu.
- extendedWaitUntil:
    visible: 'Edit profile'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s29-04-profile
- pressKey: back
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: 'Notifications.*'
# The bell opens the Notifications screen (owner, 2026-11-07), not a dropdown.
- extendedWaitUntil:
    visible: 'Notification settings'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s29-05-notification-bell
- pressKey: back
- waitForAnimationToEnd:
    timeout: 3000
# Super finds a running season's work queues on its page. The seeded active season is gbv-<this year>.
- evalScript: ${output.year = new Date().getFullYear()}
- openLink: spacev2://seasons/gbv-${output.year}
- extendedWaitUntil:
    visible: 'Code: gbv-${output.year}'
    timeout: 40000
- scrollUntilVisible:
    element: '(?i)needs attention'
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s29-06-season-needs-attention
