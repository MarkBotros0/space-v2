# UI sweep s32 — Roster, group import, new group and new session as a super admin. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${SUPER_EMAIL}
- evalScript: ${output.year = new Date().getFullYear()}
- openLink: spacev2://seasons/gbv-${output.year}/roster
- extendedWaitUntil:
    visible: 'Search students'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s32-01-roster
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s32-02-roster-bottom
# Save is never tapped; no row's group is changed.
- openLink: spacev2://seasons/gbv-${output.year}/roster/import
- extendedWaitUntil:
    visible: 'Import group assignments'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s32-03-roster-import
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Paste your spreadsheet'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s32-04-roster-import-paste-kbd
- inputText: 'email,group'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s32-05-roster-import-paste-typed
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s32-06-roster-import-bottom
# New group and new session need ?seasonId=; the seeded current season is id 2.
- openLink: spacev2://group/new?seasonId=2
- extendedWaitUntil:
    visible: 'Add a group to .+\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s32-07-group-new
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Name'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s32-08-group-new-name-kbd
- inputText: 'Sweep group'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s32-09-group-new-name-typed
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s32-10-group-new-bottom
- openLink: spacev2://session/new?seasonId=2
- extendedWaitUntil:
    visible: 'Add a session to .+\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s32-11-session-new
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Title'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s32-12-session-new-title-kbd
- inputText: 'Sweep session'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s32-13-session-new-title-typed
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s32-14-session-new-bottom
