# UI sweep s31 — New season, edit season and the duplicate dialog as a super admin. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${SUPER_EMAIL}
- openLink: spacev2://seasons/new
- extendedWaitUntil:
    visible: 'Set up a new program season\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s31-01-season-new
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Program'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s31-02-season-new-program-kbd
- inputText: 'GBV'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s31-03-season-new-program-typed
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Year'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s31-04-season-new-year-kbd
- inputText: '2099'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s31-05-season-new-year-typed
# Status and Start date open popovers; Back closes them without picking anything.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Status'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s31-06-season-new-status-open
- pressKey: back
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Start date'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s31-07-season-new-start-date-open
- pressKey: back
- waitForAnimationToEnd:
    timeout: 3000
# Last item has to clear the floating tab bar and the system bar.
- runFlow:
    file: ../_scroll-end.yaml
- takeScreenshot: s31-08-season-new-bottom
# Create season is never tapped.
- evalScript: ${output.year = new Date().getFullYear()}
- openLink: spacev2://seasons/gbv-${output.year}/edit
- extendedWaitUntil:
    visible: 'Code: gbv-${output.year}'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s31-09-season-edit
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Year'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s31-10-season-edit-year-kbd
- hideKeyboard
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s31-11-season-edit-bottom
# Save changes and Delete season are never tapped.
- openLink: spacev2://seasons/gbv-${output.year}
- extendedWaitUntil:
    visible: 'Code: gbv-${output.year}'
    timeout: 40000
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Duplicate season'
- extendedWaitUntil:
    visible: 'Duplicate GBV .*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s31-12-duplicate-dialog
- tapOn: 'Year'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s31-13-duplicate-year-kbd
- hideKeyboard
# Close the sheet with Back, never Duplicate.
- pressKey: back
- waitForAnimationToEnd:
    timeout: 5000
