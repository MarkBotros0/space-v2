# UI sweep s47 — Dashboard as an alumnus, with the user menu and the bell. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${ALUMNI_EMAIL}
- openLink: spacev2://dashboard
- extendedWaitUntil:
    visible: 'View my history'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s47-01-dashboard
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s47-02-dashboard-bottom
# The user menu and the bell popover; Back closes each (rows and Mark all read are never tapped).
# Scrolled down: the in-content bell and user menu are gone, the compact header
# (titled "Today", R31) carries them once it has faded in.
- extendedWaitUntil:
    visible: 'User menu'
    timeout: 10000
- tapOn: 'User menu'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s47-03-user-menu
- pressKey: back
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: 'Notifications.*'
- extendedWaitUntil:
    visible: 'View all'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s47-04-notification-bell
- pressKey: back
- waitForAnimationToEnd:
    timeout: 3000
# The seeded kickoff event is the only upcoming event, so it is the hero and 'View event' opens it (the event has
# no link, so nothing leaves the app). Exactly one tap, so the detail wait below always sees this event.
- scrollUntilVisible:
    element: 'Sweep kickoff event.*'
    direction: UP
    timeout: 20000
- tapOn: 'View event'
- extendedWaitUntil:
    visible: 'Fake organisation-wide event for the UI sweep\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s47-05-event-detail
