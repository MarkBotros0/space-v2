# UI sweep s47 — Dashboard as an alumnus, with the user menu and the bell. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${ALUMNI_EMAIL}
# 'View my history' is the last row now, below the fold: wait on the last-season card
# ("GBV <year> finished"), which follows the announcements row at the top once history loads.
- openLink: spacev2://dashboard
- extendedWaitUntil:
    visible: '.*GBV \d+ finished.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s47-01-dashboard
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s47-02-dashboard-bottom
# The user menu and the bell popover; Back closes each (rows and Mark all read are never tapped).
# Scrolled down: the in-content bell and user menu are gone, the compact header
# (titled "Home", R31) carries them once it has faded in.
- extendedWaitUntil:
    visible: 'Profile'
    timeout: 10000
- tapOn: 'Profile'
# The avatar opens Profile (owner, 2026-11-07), not a menu.
- extendedWaitUntil:
    visible: 'Edit profile'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s47-03-profile
- pressKey: back
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: 'Notifications.*'
# The bell opens the Notifications screen (owner, 2026-11-07), not a dropdown.
- extendedWaitUntil:
    visible: 'Notification settings'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s47-04-notification-bell
- pressKey: back
- waitForAnimationToEnd:
    timeout: 3000
# The seeded kickoff event is the earliest upcoming event, so it is the hero and 'View event' opens it (the sweep DB
# also has 'Alumni reunion dinner', id 2, 2026-11-25, ALUMNI_ONLY, listed below it; the kickoff event has no link,
# so nothing leaves the app). Exactly one tap, so the detail wait below always sees this event.
- scrollUntilVisible:
    element: 'Sweep kickoff event.*'
    direction: UP
    timeout: 20000
# The hero's button can sit just below the fold once its title is visible.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'View event'
- extendedWaitUntil:
    visible: 'Fake organisation-wide event for the UI sweep\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s47-05-event-detail
