# UI sweep s53 — Today as an alumnus. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${ALUMNI_EMAIL}
- openLink: spacev2://dashboard
# "Hi, <name>" is the title from the first frame; the last-season card ("GBV <year> finished")
# means the history has loaded. Alumni Home leads with the announcements row, then that card.
- extendedWaitUntil:
    visible: 'Hi, .*'
    timeout: 40000
- extendedWaitUntil:
    visible: '.*GBV \d+ finished.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s53-01-today-alumnus
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s53-02-today-alumnus-bottom
