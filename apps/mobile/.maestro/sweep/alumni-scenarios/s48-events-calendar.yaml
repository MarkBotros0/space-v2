# UI sweep s48 — Events (the calendar) as an alumnus, every view. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${ALUMNI_EMAIL}
- openLink: spacev2://calendar
- extendedWaitUntil:
    visible: 'Upcoming'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s48-01-events
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s48-02-events-bottom
- scrollUntilVisible:
    element: 'Week'
    direction: UP
    timeout: 20000
- tapOn: 'Week'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s48-03-events-week
- tapOn: 'Month'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s48-04-events-month
- tapOn: 'Previous month'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s48-05-events-previous-month
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s48-06-events-month-bottom
# The alumni-only event, opened by id (seed order: event 2).
- openLink: spacev2://event/2
- extendedWaitUntil:
    visible: 'Fake alumni-only event for the UI sweep\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s48-07-event-alumni-only
