# UI sweep s49 — My History as an alumnus. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${ALUMNI_EMAIL}
- openLink: spacev2://history
- extendedWaitUntil:
    visible: 'Participated'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s49-01-history
# Expand one curriculum (read-only).
- tapOn:
    text: 'Curriculum.*'
    index: 0
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s49-01b-history-curriculum
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s49-02-history-mid
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s49-03-history-bottom
