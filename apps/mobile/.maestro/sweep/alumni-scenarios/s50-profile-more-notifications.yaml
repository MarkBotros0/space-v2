# UI sweep s50 — Profile, Edit profile, More, notifications and Notification settings as an alumnus. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${ALUMNI_EMAIL}
- openLink: spacev2://profile
# One Profile page (owner, 2026-11-07): read-only, the academic record with "School of N"
# (maybe below the fold), and its Edit opens /edit-profile. Edit renders once the profile loads.
- extendedWaitUntil:
    visible: 'Edit profile'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s50-01-profile
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s50-02-profile-bottom
- openLink: spacev2://more
- extendedWaitUntil:
    visible: 'Account, settings, and more places to go\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s50-03-more
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s50-04-more-bottom
# Rows are never tapped: opening one marks it read.
- openLink: spacev2://notifications
- extendedWaitUntil:
    visible: '\d+ unread'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s50-05-notifications
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s50-06-notifications-bottom
# Notification settings open from the gear on Notifications (no Settings page any more).
# The gear sits above the list, so it is still on screen after the scroll.
- tapOn: 'Notification settings'
# The push section's description is on no other screen. Enable push is never tapped.
- extendedWaitUntil:
    visible: 'Alerts on this device\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s50-07-notification-settings
# Last item has to clear the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s50-08-notification-settings-bottom
# Edit profile: an alumnus edits their details only; the academic record stays read-only.
# Save changes is never tapped.
# Opened by link: Profile is an alumni tab and keeps its scroll, so its Edit may be off screen.
- openLink: spacev2://edit-profile
# Only the edit form has the email's description; "Your details" is on Profile too.
- extendedWaitUntil:
    visible: 'To change your email, contact the JPC team\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s50-09-edit-profile
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Name'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s50-10-edit-profile-name-kbd
- hideKeyboard
# Last field has to clear the pinned Save bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s50-11-edit-profile-bottom
