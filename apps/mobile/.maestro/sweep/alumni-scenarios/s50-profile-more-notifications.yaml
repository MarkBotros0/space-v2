# UI sweep s50 — Profile, More, notifications and Settings as an alumnus. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${ALUMNI_EMAIL}
- openLink: spacev2://profile
- extendedWaitUntil:
    visible: 'Your alumni record'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s50-01-profile
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s50-02-profile-bottom
- openLink: spacev2://more
- extendedWaitUntil:
    visible: 'Account, settings, and more places to go\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s50-03-more
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s50-04-more-bottom
# Rows are never tapped: opening one marks it read.
- openLink: spacev2://notifications
- extendedWaitUntil:
    visible: '\d+ unread'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s50-05-notifications
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s50-06-notifications-bottom
- openLink: spacev2://settings
- extendedWaitUntil:
    visible: 'Profile, password, and notification preferences\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s50-07-settings
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Name'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s50-08-settings-name-kbd
- hideKeyboard
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s50-09-settings-bottom
