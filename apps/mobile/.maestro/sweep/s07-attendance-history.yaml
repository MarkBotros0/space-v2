# UI sweep s07 — Attendance and history as a student. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: _sign-in.yaml
    env:
      EMAIL: ${STUDENT_EMAIL}
- openLink: spacev2://attendance
- extendedWaitUntil:
    visible: 'Absence budget'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s07-01-attendance
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s07-02-attendance-bottom
- openLink: spacev2://history
- extendedWaitUntil:
    visible: 'Seasons you.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s07-03-history
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s07-04-history-bottom
