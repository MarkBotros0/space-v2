# Design catalogue: scrolls section ${SECTION}'s title (catalogue-<id>-title)
# fully into view and centres it. A section the previous shot already showed
# whole is not scrolled again, so two short sections can share a picture; that
# loses no coverage. (An earlier version swiped the title up under the pinned
# header and back, which landed it under the header on small gesture-nav
# phones and failed the flow.)
appId: com.jpc.space
---
- scrollUntilVisible:
    element:
      id: catalogue-${SECTION}-title
    direction: DOWN
    centerElement: true
    visibilityPercentage: 100
    # Long: when hideKeyboard leaves the catalogue, s90 reopens it at the top and the later
    # sections are a long way down at font 1.3 (whole-app sweep, Nov 2026).
    timeout: 180000
- waitForAnimationToEnd:
    timeout: 3000
