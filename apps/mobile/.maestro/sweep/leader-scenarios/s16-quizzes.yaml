# UI sweep s16 — Quizzes and grading as a leader. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${LEADER_EMAIL}
- openLink: spacev2://quizzes
- extendedWaitUntil:
    visible: 'Grade paper quizzes for your group'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-01-quizzes
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-02-quizzes-bottom
# Quiz ids are the seed's insertion order: 1 = paper quiz, 2 = online quiz.
- openLink: spacev2://quiz/1/grade
- extendedWaitUntil:
    visible: '.*Max score.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-03-paper-grade
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Score for Samir Student'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-04-paper-score-kbd
- eraseText: 10
- inputText: '90'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-05-paper-score-typed
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-06-paper-grade-bottom
- openLink: spacev2://quiz/2/grade
- extendedWaitUntil:
    visible: '.*Awaiting grading'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-07-online-grade
# Marks fields. Save grade is never tapped.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Marks for What do you hope to learn this season\?'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-08-essay-marks-kbd
- eraseText: 10
- inputText: '1'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-09-essay-marks-typed
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-10-online-grade-bottom
