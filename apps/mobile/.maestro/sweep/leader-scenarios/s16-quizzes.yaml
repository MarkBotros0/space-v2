# UI sweep s16 — Quizzes and grading as a leader. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${LEADER_EMAIL}
- openLink: spacev2://quizzes
- extendedWaitUntil:
    visible: 'Grade paper quizzes for your group'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-01-quizzes
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-02-quizzes-bottom
# Quiz ids are the seed's insertion order: 1 = paper quiz, 2 = online quiz.
- openLink: spacev2://quiz/1/grade
- extendedWaitUntil:
    visible: '.*Max score.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-03-paper-grade
# A row's label is "title, subtitle", so match the name as a prefix. The sheet's field is
# the proof it opened: "Score for ..." exists nowhere on the list.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Samir Student.*'
- extendedWaitUntil:
    visible: 'Score for Samir Student'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-04-paper-sheet
# Tapped directly: _tap's centring scroll starts mid-screen, which on a tall phone is the
# backdrop and dismisses the sheet. The field is always on screen here.
- tapOn: 'Score for Samir Student'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-05-paper-score-kbd
- eraseText: 10
- inputText: '90'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-06-paper-score-typed
# Save is never tapped: back dismisses the sheet.
- back
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-07-paper-grade-dismissed
# Waits on the subtitle: the Results card (held / released) now sits above the
# attempts, so the attempt row may start below the fold on the small phone.
- openLink: spacev2://quiz/2/grade
- extendedWaitUntil:
    visible: 'Max score: \d+'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-08-online-grade
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-09-online-grade-bottom
# Reopen the screen so the rows are back at the top.
- openLink: spacev2://quiz/2/grade
- extendedWaitUntil:
    visible: 'Max score: \d+'
    timeout: 40000
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: '.*Awaiting grading.*'
# Save marks is only in the sheet.
- extendedWaitUntil:
    visible: 'Save marks'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-10-attempt-sheet
# Right / Wrong is local until Save marks, which is never tapped. One essay: one toggle.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Right'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-11-essay-marked
- back
- waitForAnimationToEnd:
    timeout: 5000
# Quiz 3 (seed-sweep/quiz-types.ts): the classmate's submitted attempt with every question type,
# Arabic content, two blanks and an essay to mark. The auto-marked types show their marks.
- openLink: spacev2://quiz/3/grade
- extendedWaitUntil:
    visible: 'Max score: \d+'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-12-types-grade
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: '.*Awaiting grading.*'
- extendedWaitUntil:
    visible: 'Save marks'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-13-types-sheet
# Scrolls inside the sheet (it fills 90% of the screen, so the middle is its content).
- scrollUntilVisible:
    element: 'Student.s match: .*'
    direction: DOWN
    centerElement: true
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-14-types-sheet-matching
- scrollUntilVisible:
    element: 'Blank 2'
    direction: DOWN
    centerElement: true
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-15-types-sheet-blanks
# Marks the first blank right and the second wrong: local until Save marks.
# Relative to each blank's caption: the matching rows above also carry the words Right and Wrong.
- tapOn:
    text: 'Right'
    below: 'Blank 1'
- tapOn:
    text: 'Wrong'
    below: 'Blank 2'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-16-types-sheet-blanks-marked
- runFlow: ../_scroll-end.yaml
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s16-17-types-sheet-bottom
- back
- waitForAnimationToEnd:
    timeout: 5000
