# UI sweep s18 — Notifications and More as a leader. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${LEADER_EMAIL}
# The unread count only shows once the list has loaded; "Notifications" is the title
# from the first frame.
- openLink: spacev2://notifications
- extendedWaitUntil:
    visible: '\d+ unread'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s18-01-notifications
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s18-02-notifications-bottom
# Rows are never tapped: opening one marks it read.
# More holds the name row (Profile), Announcements, the pages that are not tabs, the
# theme (Appearance), Sign out and Delete account. Neither of the last two is tapped.
- openLink: spacev2://more
- extendedWaitUntil:
    visible: 'Account, settings, and more places to go\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s18-03-more
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s18-04-more-bottom
