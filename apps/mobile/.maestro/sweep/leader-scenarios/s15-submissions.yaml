# UI sweep s15 — Submissions and review as a leader. Read-only: nothing is saved, the flow only
# opens, scrolls and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${LEADER_EMAIL}
- openLink: spacev2://submissions
- extendedWaitUntil:
    visible: '.*waiting review.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s15-01-queue
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s15-02-queue-bottom
# Waiting rows come before Reviewed ones, so the first Salma row is the late essay.
# A row's label is "title, subtitle", so match the name as a prefix.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Salma Student.*'
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    # Section headers are upper-cased by style; match either case.
    visible: '(?i)question'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s15-03-submission
# The Return sheet, opened from the pinned bar (ruling: a flow may open it and focus its note,
# never type; its Return stays disabled until a note is typed). The Mark reviewed sheet is never
# opened: its save button would write.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Return'
- extendedWaitUntil:
    visible: 'What to change'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s15-04-return-sheet
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'What to change'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s15-04b-return-note-kbd
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
# Close the sheet without returning anything.
- back
- waitForAnimationToEnd:
    timeout: 5000
# Last item has to clear the pinned bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s15-06-submission-bottom
# Back lands on the first screen of the session, not the queue: reopen the queue.
- openLink: spacev2://submissions
# The queue keeps its scroll position, so its heading may be off-screen: wait
# on a row, then swipe back to the top (left margin, like _tap.yaml).
- extendedWaitUntil:
    visible: 'Salma Student.*'
    timeout: 40000
- repeat:
    times: 4
    commands:
      - swipe:
          start: 4%, 35%
          end: 4%, 70%
          duration: 500
- waitForAnimationToEnd:
    timeout: 5000
# The reviewed row: the bar reads Update feedback. Two Salma essays wait for review
# (the reflection, then The lost son), so the reviewed one is the third Salma row.
- tapOn:
    text: 'Salma Student.*'
    index: 2
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: 'Update feedback'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s15-07-submission-reviewed
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s15-08-submission-reviewed-bottom
