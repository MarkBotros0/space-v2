# UI sweep s15 — Submissions and review as a leader. Read-only: nothing is saved, the flow only
# opens, scrolls and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${LEADER_EMAIL}
- openLink: spacev2://submissions
# A leader's /submissions is Work now: assignments with a "N to review" chip, not one row per essay.
- extendedWaitUntil:
    visible: '.*to review'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s15-01-queue
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s15-02-queue-bottom
# Salma's late essay is on "Opening night reflection": its assignment page, then her row.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Opening night reflection.*'
# The Parts header, near the top: the progress card is below the fold on a small phone at 1.3.
- extendedWaitUntil:
    visible: '(?i)parts'
    timeout: 40000
# Salma handed it in, so she is under Finished.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Finished \(\d+\)'
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Salma Student.*'
- extendedWaitUntil:
    visible: 'Mark reviewed'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s15-03-submission
# The Return sheet, opened from the pinned bar (ruling: a flow may open it and focus its note,
# never type; its Return stays disabled until a note is typed). The Mark reviewed sheet is never
# opened: its save button would write.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Return'
- extendedWaitUntil:
    visible: 'What to change'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s15-04-return-sheet
# A plain tap: the field is on screen, and _tap's centring scroll drags the sheet closed.
- tapOn: 'What to change'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s15-04b-return-note-kbd
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
# Close the sheet without returning anything.
- back
- waitForAnimationToEnd:
    timeout: 5000
# Last item has to clear the pinned bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s15-06-submission-bottom
# The reviewed essay ("Update feedback") was reached through the old one-row-per-essay queue; the
# Work list has no such row, so that state is not swept (sweep 2026-11-16).
