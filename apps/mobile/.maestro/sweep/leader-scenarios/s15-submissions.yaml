# UI sweep s15 — Submissions and review as a leader. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${LEADER_EMAIL}
- openLink: spacev2://submissions
- extendedWaitUntil:
    visible: '.*pending review.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s15-01-queue
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s15-02-queue-bottom
# Order is SUBMITTED then REVIEWED, so the first Salma row is the late submission.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Salma Student'
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: 'Assignment prompt'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s15-03-submission
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'What did the student do well.*'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s15-04-feedback-kbd
- inputText: 'Sweep feedback, never saved'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s15-05-feedback-typed
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s15-06-submission-bottom
# Back lands on the first screen of the session, not the queue: reopen the queue.
- openLink: spacev2://submissions
# The queue keeps its scroll position, so its heading may be off-screen: wait
# on a row, then swipe back to the top (left margin, like _tap.yaml).
- extendedWaitUntil:
    visible: 'Salma Student'
    timeout: 40000
- repeat:
    times: 4
    commands:
      - swipe:
          start: 4%, 35%
          end: 4%, 70%
          duration: 500
- waitForAnimationToEnd:
    timeout: 5000
# The reviewed row, found by its assignment title: the form reads Update feedback.
# Only the student's name is a link, so tap the second Salma row.
- tapOn:
    text: 'Salma Student'
    index: 1
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: 'Update feedback'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s15-07-submission-reviewed
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s15-08-submission-reviewed-bottom
