# UI sweep s10 — Dashboard as a leader. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${LEADER_EMAIL}
- extendedWaitUntil:
    # The tab label "Home" shows before the data loads, so wait on the season ring that
    # leads Home now (owner, 2026-11-08); the session sits below it, maybe below the fold.
    visible: 'Sessions held.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s10-01-dashboard
# The session, 'Waiting for you', 'Students at risk' and the events sit below the fold.
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s10-02-dashboard-bottom
# The leader-today catalogue section is shot by s90 (it is near the catalogue's end; scrolling to it here timed out at font 1.3).
