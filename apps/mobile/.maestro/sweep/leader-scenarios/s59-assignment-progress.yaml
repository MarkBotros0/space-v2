# UI sweep s59 — an assignment's progress per part, one essay's review and the essay queue, as a
# leader. Read-only: Mark reviewed and Return are never tapped. The seed
# (apps/backend/scripts/seed-sweep/three-part.ts) has one student part-way and Salma finished,
# her essay waiting review. Assignment 2 ("Read chapter 2") is where the leader marked Samir submitted
# for work done outside the app (activity.ts seedPassing): his row opens Undo, Salma's opens Mark as submitted.
# Neither button is tapped.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${LEADER_EMAIL}
# Assignment 3 is "The lost son".
- openLink: spacev2://assignment/3
# The Parts header, near the top: the progress card is below the fold on a small phone at 1.3.
- extendedWaitUntil:
    visible: '(?i)parts'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s59-01-staff-page
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s59-02-progress
# Salma's row (under Finished) opens her one handed-in essay. A row's label starts with the name.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Finished \(\d+\)'
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Salma Student.*'
- extendedWaitUntil:
    visible: 'Mark reviewed'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s59-03-essay-review
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s59-04-essay-review-bottom
# The queue: a leader's /submissions is Work, assignments with a "N to review" chip.
- openLink: spacev2://submissions
- extendedWaitUntil:
    visible: '.*to review'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s59-05-queue
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s59-06-queue-bottom
# The forum part, read by staff from the assignment's Parts list.
- openLink: spacev2://assignment/3
# The Parts header, near the top: the progress card is below the fold on a small phone at 1.3.
- extendedWaitUntil:
    visible: '(?i)parts'
    timeout: 40000
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: '(?s)(Forum: )?Share one takeaway with your group\..*'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s59-07-forum
# The staff mark: Samir was marked submitted by the leader on Read chapter 2. A row's label starts with the name.
- openLink: spacev2://assignment/2
# The Parts header, near the top: the progress card is below the fold on a small phone at 1.3.
- extendedWaitUntil:
    visible: '(?i)parts'
    timeout: 40000
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s59-08-marked-row
# Samir was marked submitted, so he is under Finished.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Finished \(\d+\)'
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Samir Student.*'
- extendedWaitUntil:
    visible: 'Undo, not submitted'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s59-09-undo-sheet
- tapOn: 'Cancel'
- waitForAnimationToEnd:
    timeout: 5000
# Everyone has finished Read chapter 2 in the seed (Salma's own submission), so the Mark as
# submitted sheet is shot on The lost son (assignment 3), where Samir has not finished.
- openLink: spacev2://assignment/3
- extendedWaitUntil:
    visible: '(?i)parts'
    timeout: 40000
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Not finished \(\d+\)'
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Samir Student.*'
- extendedWaitUntil:
    visible: 'Mark as submitted'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s59-10-mark-sheet
- tapOn: 'Cancel'
