# UI sweep s59 — an assignment's progress per part, one essay's review and the essay queue, as a
# leader. Read-only: Mark reviewed and Return are never tapped. The seed
# (apps/backend/scripts/seed-sweep/three-part.ts) has one student part-way and Salma finished,
# her essay waiting review. Assignment 2 ("Read chapter 2") is where the leader marked Samir submitted
# for work done outside the app (activity.ts seedPassing): his row opens Undo, Salma's opens Mark as submitted.
# Neither button is tapped.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${LEADER_EMAIL}
# Assignment 3 is "The lost son".
- openLink: spacev2://assignment/3
- extendedWaitUntil:
    visible: '\d+ of \d+ students? finished'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s59-01-staff-page
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s59-02-progress
# Salma's row opens her one handed-in essay. A row's label starts with the name.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Salma Student.*'
- extendedWaitUntil:
    visible: 'Mark reviewed'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s59-03-essay-review
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s59-04-essay-review-bottom
# The queue: one row per essay.
- openLink: spacev2://submissions
- extendedWaitUntil:
    visible: '.*waiting review.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s59-05-queue
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s59-06-queue-bottom
# The forum part, read by staff from the assignment's Parts list.
- openLink: spacev2://assignment/3
- extendedWaitUntil:
    visible: '\d+ of \d+ students? finished'
    timeout: 40000
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: '(?s)Forum: Share one takeaway with your group\..*'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s59-07-forum
# The staff mark: Samir was marked submitted by the leader, Salma has nothing. A row's label starts with the name.
- openLink: spacev2://assignment/2
- extendedWaitUntil:
    visible: '\d+ of \d+ students? finished'
    timeout: 40000
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s59-08-marked-row
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Samir Student.*'
- extendedWaitUntil:
    visible: 'Undo, not submitted'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s59-09-undo-sheet
- tapOn: 'Cancel'
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Salma Student.*'
- extendedWaitUntil:
    visible: 'Mark as submitted'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s59-10-mark-sheet
- tapOn: 'Cancel'
