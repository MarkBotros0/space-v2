# UI sweep s12 — Student page and note sheet as a leader. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${LEADER_EMAIL}
- openLink: spacev2://groups
- extendedWaitUntil:
    visible: 'Groups'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
# Reached through the group's student row, as a leader would.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Samir Student'
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: 'student@sweep.jpc.test'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-01-student
# The tab row scrolls sideways: Notes is off screen until it is swiped. Each tab
# loads its data the first time it opens.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Seasons'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-02-tab-seasons
- tapOn: 'Attendance'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-03-tab-attendance
- tapOn: 'Submissions'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-04-tab-submissions
# Swiped from the middle tab: at font 1.3 'Submissions' sits against the right
# edge, where a gesture-nav swipe is the system Back gesture and leaves the page.
- swipe:
    from:
      text: 'Attendance'
    direction: LEFT
- swipe:
    from:
      text: 'Attendance'
    direction: LEFT
- tapOn: 'Notes'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-05-tab-notes
# The note sheet. Its "Visible to" label is not on any tab or the page, so waiting on
# it means the sheet is up. Add note is never tapped; back closes the sheet unsaved.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Write a note'
- extendedWaitUntil:
    visible: 'Visible to'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-06-note-sheet
- tapOn: 'Reflections.*'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-07-note-kbd
- inputText: 'Sweep note, never saved'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-08-note-typed
- back
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-09-note-dismissed
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-10-notes-scrolled
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-11-student-bottom
