# UI sweep s12 — Student page and note sheet as a leader. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${LEADER_EMAIL}
# "My group" lists the group's students under its row (owner, 2026-11-07).
- openLink: spacev2://groups
- extendedWaitUntil:
    visible: 'Group A.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
# Reached through the group's student row, as a leader would.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Samir Student'
- waitForAnimationToEnd:
    timeout: 5000
# The page shows no email any more (owner, 2026-11-07): wait on the This season card's
# first figure ("Attendance: N%, x of y"), the top of the page.
- extendedWaitUntil:
    visible: 'Attendance: \d+%.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-01-student
# The sections are one segmented control now (Submissions, Attendance, Notes, Seasons;
# Submissions opens first), so nothing is swiped. Each section loads its data the first
# time it opens. Attendance is matched right of Submissions: the This season card above
# also carries an "Attendance" label.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Seasons'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-02-tab-seasons
- tapOn:
    text: 'Attendance'
    rightOf: 'Submissions'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-03-tab-attendance
- tapOn: 'Submissions'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-04-tab-submissions
- tapOn: 'Notes'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-05-tab-notes
# The note sheet. Its "Visible to" label is not on any tab or the page, so waiting on
# it means the sheet is up. Add note is never tapped; back closes the sheet unsaved.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Write a note'
- extendedWaitUntil:
    visible: 'Visible to'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-06-note-sheet
- tapOn: 'Reflections.*'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-07-note-kbd
- inputText: 'Sweep note, never saved'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-08-note-typed
- back
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-09-note-dismissed
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-10-notes-scrolled
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-11-student-bottom
