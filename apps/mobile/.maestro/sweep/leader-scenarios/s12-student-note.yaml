# UI sweep s12 — Student page and note form as a leader. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${LEADER_EMAIL}
- openLink: spacev2://groups
- extendedWaitUntil:
    visible: 'My groups'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
# Reached through the group card's member link, as a leader would.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Samir Student'
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: '.*leader view'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-01-student
# The note form: placeholder text finds the textarea. Add note is never tapped.
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Reflections.*'
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-02-note-kbd
- inputText: 'Sweep note, never saved'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-03-note-typed
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-04-note-form-scrolled
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s12-05-student-bottom
