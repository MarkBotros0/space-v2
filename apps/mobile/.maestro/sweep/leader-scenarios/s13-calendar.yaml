# UI sweep s13 — Calendar as a leader. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${LEADER_EMAIL}
- openLink: spacev2://calendar
- extendedWaitUntil:
    visible: '\d+ sessions?'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s13-01-calendar
- tapOn: 'Month'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s13-02-calendar-month
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s13-03-calendar-bottom
# A session detail, reached from the Upcoming list (Month view has no rows).
# Back to the top (left margin, like _tap.yaml) where the view toggle is.
- repeat:
    times: 4
    commands:
      - swipe:
          start: 4%, 35%
          end: 4%, 70%
          duration: 500
- tapOn: 'Upcoming'
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: 'Week 2: Calling'
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s13-04-session-detail
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s13-05-session-detail-bottom
