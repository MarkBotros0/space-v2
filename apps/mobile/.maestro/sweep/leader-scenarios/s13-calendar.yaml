# UI sweep s13 — Calendar as a leader. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${LEADER_EMAIL}
- openLink: spacev2://calendar
- extendedWaitUntil:
    visible: '\d+ sessions?'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s13-01-calendar
- tapOn: 'Month'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s13-02-calendar-month
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s13-03-calendar-bottom
# A session detail, reached by a row's "NN min" line. Optional: an empty
# calendar has none, which is a state to report, not a failure.
- tapOn:
    text: '\d+ min'
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s13-04-session-detail
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s13-05-session-detail-bottom
