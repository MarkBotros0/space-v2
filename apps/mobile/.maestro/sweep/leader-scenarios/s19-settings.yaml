# UI sweep s19 — Profile, Edit profile and Notification settings as a leader. Read-only: nothing
# is saved, the flow only opens, scrolls, types and looks.
# There is no Settings page any more (owner, 2026-11-07): Profile (/profile) is read-only and
# its Edit opens /edit-profile; notification settings open from the gear on Notifications
# (/settings/notifications); the theme and Sign out live on More (s18).
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${LEADER_EMAIL}
- openLink: spacev2://profile
- extendedWaitUntil:
    visible: 'Edit profile'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s19-01-profile
# Last item has to clear the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s19-02-profile-bottom
# A leader is staff: one form (Your details), no academic record. Save changes is never tapped.
# Opened by link: Profile was just scrolled to its end, so its Edit may be off screen.
- openLink: spacev2://edit-profile
# Only the edit form has the email's description; "Your details" is on Profile too.
- extendedWaitUntil:
    visible: 'To change your email, contact the JPC team\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s19-03-edit-profile
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Name'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s19-04-edit-profile-name-kbd
- hideKeyboard
- runFlow:
    file: ../_tap.yaml
    env:
      TARGET: 'Address'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s19-05-edit-profile-address-kbd
- hideKeyboard
# Last field has to clear the pinned Save bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s19-06-edit-profile-bottom
# Back without saving: nothing was typed. Then the gear on Notifications, as a leader would.
- back
- waitForAnimationToEnd:
    timeout: 5000
- openLink: spacev2://notifications
- extendedWaitUntil:
    visible: '\d+ unread'
    timeout: 40000
- tapOn: 'Notification settings'
# The push section's description is on no other screen. Enable push is never tapped.
- extendedWaitUntil:
    visible: 'Alerts on this device\.'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s19-07-notification-settings
# Last switch (when push is on) has to clear the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s19-08-notification-settings-bottom
