# UI sweep s11 — Groups as a leader. Read-only: nothing is saved, the flow only
# opens, scrolls, types and looks.
appId: com.jpc.space
---
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${LEADER_EMAIL}
# The leader's tab is "My group" (owner, 2026-11-07), which is also the tab label: wait
# on the group's own row ("Group A, GBV <year> · 2 students") instead.
- openLink: spacev2://groups
- extendedWaitUntil:
    visible: 'Group A.*'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s11-01-groups
# Last item has to clear the floating tab bar and the system bar.
- scroll
- scroll
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s11-02-groups-bottom
# The group's own page (seed: Group A is group 1).
# Waits on the group's description (its subtitle): "Group A" is on the list too.
- openLink: spacev2://group/1
- extendedWaitUntil:
    visible: 'Tuesday evening group'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s11-03-group-detail
