appId: com.jpc.space
---
# On the CI emulator the app now and then starts to a blank screen and never
# draws the sign-in page (3 of 144 flow runs on 2026-10-20, all dark cells);
# starting it again from scratch gets past it.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible: "Sign in"
          timeout: 30000
- tapOn:
    id: "login-email"
- inputText: ${EMAIL}
# The open keyboard covers the password field on a small phone at font 1.3
# (UI sweep finding, CLAUDE.md "Rules from the UI sweep"); close it first.
- hideKeyboard
- tapOn:
    id: "login-password"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- extendedWaitUntil:
    notVisible: "Sign in"
    timeout: 30000
