appId: com.jpc.space
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 30000
- tapOn:
    id: "login-email"
- inputText: ${EMAIL}
# The open keyboard covers the password field on a small phone at font 1.3
# (UI sweep finding, CLAUDE.md "Rules from the UI sweep"); close it first.
- hideKeyboard
- tapOn:
    id: "login-password"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- extendedWaitUntil:
    notVisible: "Sign in"
    timeout: 30000
